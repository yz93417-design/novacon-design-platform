<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>诺康莱集团设计中台管理系统</title>
<style>
  :root{
    --cream:#0E0C0B; --paper:#171413; --ink:#F2EAE1; --sub:#C4B8AC; --faint:#8C8078;
    --line:#332D29; --red:#C9303F; --gold:#D9B166; --soft:#221D1A;
    --green:#4E9A76; --blue:#5A9BC0; --gray:#8A7D74;
    --raise:#1D1917; --raise2:#242020; --hover:#2A2420;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--cream); color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  button{font-family:inherit; cursor:pointer;}
  input,textarea{font-family:inherit;}

  /* ---------- 顶栏 ---------- */
  #topbar{
    height:62px; display:flex; align-items:center; gap:16px; padding:0 18px;
    background:var(--paper); border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:9px; font-weight:700; font-size:15px; letter-spacing:.5px; white-space:nowrap;}
  .brand .dot{width:9px; height:9px; background:var(--red); border-radius:50%; box-shadow:0 0 0 4px rgba(201,48,63,.22);}
  #tabs{display:flex; align-items:center; gap:6px; overflow-x:auto; flex:1; scrollbar-width:none;}
  #tabs::-webkit-scrollbar{display:none;}
  .tab{
    display:flex; align-items:center; gap:6px; padding:7px 13px; border-radius:2px;
    font-size:13.5px; color:var(--sub); background:transparent; border:1px solid transparent; white-space:nowrap;
  }
  .tab:hover{background:var(--soft);}
  .tab.active{background:var(--red); color:#FFF9F0; font-weight:600;}
  .tab.active .x{color:rgba(255,249,240,.7);}
  .tab .x{font-size:14px; line-height:1; color:var(--faint); padding:0 2px; visibility:hidden;}
  .tab:hover .x{visibility:visible;}
  .tab-add{
    width:30px; height:30px; border-radius:2px; border:1px dashed var(--line); background:transparent;
    color:var(--sub); font-size:17px; line-height:1; flex:0 0 auto;
  }
  .tab-add:hover{border-color:var(--gold); color:var(--red);}

  .tools{display:flex; align-items:center; gap:10px;}
  .seg{display:flex; border:1px solid var(--line); border-radius:2px; overflow:hidden; background:var(--paper);}
  .seg button{border:0; background:transparent; padding:7px 11px; font-size:13px; color:var(--sub);}
  .seg button.on{background:var(--ink); color:#12100E; font-weight:600;}
  .ghost{border:1px solid var(--line); background:var(--paper); padding:8px 13px; font-size:13px; color:var(--ink); border-radius:2px;}
  .ghost:hover{border-color:var(--gold); color:var(--red);}
  .sync{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--faint); white-space:nowrap;}
  .sync i{width:7px; height:7px; border-radius:50%; background:var(--green); display:block;}
  .sync.saving i{background:var(--gold);}

  /* ---------- 主体 ---------- */
  #main{height:calc(100% - 62px); overflow-y:auto; overflow-x:hidden; padding:18px 22px 50px;}
  .view-head{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:12px; gap:16px;}
  .vtitle{font-size:20px; font-weight:700; letter-spacing:.5px;}
  .vtitle small{font-size:12.5px; font-weight:400; color:var(--faint); margin-left:10px; letter-spacing:0;}
  .nav{display:flex; align-items:center; gap:6px;}
  .nav button{width:30px; height:30px; border:1px solid var(--line); background:var(--paper); color:var(--sub); border-radius:2px; font-size:14px;}
  .nav button:hover{border-color:var(--gold); color:var(--red);}
  .nav .wide{width:auto; padding:0 12px; font-size:12.5px;}

  /* 选择条 */
  .selbar{
    display:flex; align-items:center; gap:12px; padding:8px 12px; margin-bottom:10px;
    background:#1D1917; border:1px solid var(--gold); font-size:12.5px; color:var(--sub); flex-wrap:wrap;
  }
  .selbar b{color:var(--red);}
  .swrow{display:flex; gap:6px; align-items:center;}
  .sw{width:17px; height:17px; border-radius:50%; border:2px solid transparent; cursor:pointer; padding:0;}
  .sw:hover{transform:scale(1.1);}
  .sw.on{border-color:var(--ink);}
  .linkbtn{border:0; background:transparent; color:var(--sub); font-size:12px; text-decoration:underline; padding:0;}
  .linkbtn:hover{color:var(--red);}

  /* ---------- 横向日期条 ---------- */
  .strip-shell{position:relative; border:1px solid var(--line); background:var(--paper);}
  .strip{
    display:flex; gap:1px; background:var(--line); overflow-x:auto; overflow-y:hidden;
    cursor:grab; scrollbar-width:thin;
  }
  .strip::-webkit-scrollbar{height:9px;}
  .strip::-webkit-scrollbar-thumb{background:#3A332E; border-radius:9px;}
  .strip.dragging{cursor:grabbing;}
  .strip.dragging .daycol{pointer-events:none;}
  .daycol{flex:0 0 158px; background:var(--paper); display:flex; flex-direction:column; height:180px;}
  .daycol.wk{background:#131110;}
  .daycol.sel{box-shadow:inset 0 0 0 2px var(--ink); z-index:2;}
  .dhead{
    position:relative;
    padding:6px 9px 7px; border-bottom:1px solid var(--line); cursor:pointer; user-select:none;
    display:flex; align-items:baseline; justify-content:space-between; gap:6px; flex:0 0 auto;
  }
  .dmore{
    position:absolute; right:2px; top:2px; width:18px; height:16px; padding:0; border:0;
    background:transparent; color:#6E635C; font-size:12px; line-height:1; opacity:0; transition:opacity .12s;
  }
  .daycol:hover .dmore{opacity:1;}
  .dmore:hover{color:var(--red);}

  /* 日期格「更多」菜单 */
  .dmenu{
    position:fixed; z-index:70; width:200px; background:var(--paper); border:1px solid var(--line);
    box-shadow:0 14px 36px rgba(0,0,0,.20); padding:10px 12px 6px;
  }
  .dmenu .mt{font-size:10.5px; color:var(--faint); letter-spacing:.6px; margin-bottom:7px;}
  .dmenu .crow{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:9px;}
  .dmenu .crow .sw{width:18px; height:18px; border-radius:50%; border:1px solid rgba(0,0,0,.14);}
  .dmenu .crow .sw.on{box-shadow:0 0 0 2px var(--ink);}
  .dmenu .mi{
    display:flex; align-items:center; gap:8px; width:100%; border:0; background:transparent;
    padding:8px 2px; font-size:12.5px; color:var(--ink); text-align:left; border-top:1px solid #2C2622; cursor:pointer;
  }
  .dmenu .mi:hover{color:var(--red);}
  .dmenu .mi.danger:hover{color:#E05563;}
  .dhead:hover{background:rgba(201,48,63,.10);}
  .dnum{font-size:12.5px; font-weight:700; letter-spacing:.3px;}
  .dwd{font-size:10px; color:var(--faint); letter-spacing:.3px;}
  .daycol.today .dhead{box-shadow:inset 0 -2px 0 var(--red);}
  .daycol.today .dnum{color:var(--red);}
  .dcards{flex:1; display:flex; flex-direction:column; gap:4px; padding:5px 6px; overflow-y:auto; scrollbar-width:none;}
  .dcards::-webkit-scrollbar{width:0;}
  .mcard{
    position:relative;
    background:var(--soft); border-left:3px solid var(--gray); padding:4px 6px; cursor:pointer;
    transition:background .12s; flex:0 0 auto;
  }
  .mcard:hover{background:#2A2420;}
  .mact{
    position:absolute; right:2px; top:2px; display:flex; gap:2px;
    opacity:0; transition:opacity .12s;
  }
  .mcard:hover .mact{opacity:1;}
  .mact button{
    width:16px; height:16px; padding:0; border:0; border-radius:2px; line-height:1;
    background:rgba(29,25,23,.96); color:var(--sub); font-size:9.5px;
  }
  .mact button:hover{color:var(--red); background:#2A2420;}
  .mcard.hasimg{display:flex; gap:6px; align-items:center;}
  .mcard img{width:26px; height:34px; object-fit:cover; display:block; border:1px solid var(--line); flex:0 0 auto;}
  .mcard .mtxt{min-width:0; flex:1;}
  .mcard b{display:block; font-size:11.5px; font-weight:700; line-height:1.35; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .mcard span{display:block; color:var(--faint); font-size:10px; line-height:1.4; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:1px;}
  .mcard em{font-style:normal; font-size:9.5px; color:var(--faint);}
  .dfoot{
    flex:0 0 auto; display:flex; align-items:center; gap:4px; padding:4px 6px 5px;
    border-top:1px solid #2C2622;
  }
  .miniadd{
    width:20px; height:20px; border:1px dashed var(--line); background:transparent; color:var(--faint);
    font-size:13px; line-height:1; border-radius:2px; flex:0 0 auto; padding:0;
  }
  .miniadd:hover{border-color:var(--gold); color:var(--red);}
  .notebtn{
    margin-left:auto; display:flex; align-items:center; gap:4px; height:20px; padding:0 6px;
    border:1px solid var(--line); background:var(--paper); color:var(--sub); border-radius:2px;
    font-size:10.5px; line-height:1;
  }
  .notebtn:hover{border-color:var(--gold); color:var(--red);}
  .notebtn.has{border-color:#4A3B2A; background:#1D1917;}
  .ndots{display:flex; gap:2px;}
  .ndot{width:6px; height:6px; border-radius:50%; display:block;}
  .striptip{font-size:11.5px; color:var(--faint); margin-top:8px;}

  /* ---------- 备注 / 文本框 ---------- */
  .notes-head{display:flex; align-items:center; justify-content:space-between; margin:26px 0 10px;}
  .notes-head .t{font-size:15px; font-weight:700;}
  .notes-head .t small{font-size:12px; font-weight:400; color:var(--faint); margin-left:8px;}
  .notes{display:grid; grid-template-columns:repeat(auto-fill,minmax(276px,1fr)); gap:14px;}
  .note{
    background:var(--paper); border:1px solid var(--line); border-left:4px solid var(--gold);
    padding:11px 13px 9px; display:flex; flex-direction:column;
  }
  .note .ntop{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px;}
  .note .dchip{
    border:1px solid var(--line); background:#1D1917; color:var(--sub); font-size:10.5px;
    padding:2px 6px; border-radius:2px; line-height:1.4;
  }
  .note .dchip:hover{border-color:var(--gold); color:var(--red);}
  .note .sws{display:flex; gap:5px; align-items:center;}
  .note .sw{width:12px; height:12px; border-width:1px;}
  .note input{
    border:0; background:transparent; outline:none; padding:3px 0 5px; font-size:13px; font-weight:700;
    color:var(--ink); border-bottom:1px solid var(--line); width:100%;
  }
  .note input::placeholder{color:#6E635C; font-weight:400;}
  .note textarea{
    border:0; background:transparent; outline:none; resize:none; margin-top:8px; width:100%;
    font-size:12.5px; line-height:1.7; color:var(--sub); min-height:66px;
  }
  .note textarea::placeholder{color:#6E635C;}
  .note .nfoot{display:flex; align-items:center; justify-content:space-between; margin-top:4px;}
  .note .edel{border:0; background:transparent; color:#7B6F67; font-size:11px; padding:0;}
  .note .edel:hover{color:var(--red);}
  .note .etime{font-size:10.5px; color:#6E635C;}
  .notes-empty{
    grid-column:1/-1; border:1px dashed var(--line); padding:26px; text-align:center;
    color:var(--faint); font-size:12.5px;
  }

  /* ---------- 时间轴视图 ---------- */
  .tl{display:flex; flex-direction:column;}
  .tl-row{display:flex; gap:22px; padding:16px 0; border-top:1px solid var(--line);}
  .tl-row:first-child{border-top:0;}
  .tl-date{width:112px; flex:0 0 auto; padding-top:2px;}
  .tl-date b{display:block; font-size:19px; line-height:1.15;}
  .tl-date span{font-size:11.5px; color:var(--faint); letter-spacing:.5px;}
  .tl-cards{flex:1; display:grid; gap:14px; align-items:start;}
  .card{background:var(--paper); border:1px solid var(--line); border-left:4px solid var(--gray); padding:13px 15px; cursor:pointer; transition:box-shadow .15s;}
  .card:hover{box-shadow:0 6px 20px rgba(0,0,0,.09);}
  .card h4{margin:0; font-size:14px; font-weight:700; line-height:1.45;}
  .card p{margin:6px 0 0; font-size:12.5px; color:var(--sub); line-height:1.65; white-space:pre-wrap;}
  /* 图片统一竖版预览（3:4，宽:高） */
  .thumbs{display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:7px; margin-bottom:10px;}
  .thumbs .tcell{
    position:relative; aspect-ratio:3/4; overflow:hidden; border:1px solid var(--line); background:#2C2622;
  }
  .thumbs .tcell img{width:100%; height:100%; object-fit:cover; display:block;}
  .thumbs .tact{
    position:absolute; left:0; right:0; bottom:0; display:flex; justify-content:center; gap:3px;
    padding:14px 3px 4px; background:linear-gradient(transparent, rgba(0,0,0,.62));
    opacity:0; transition:opacity .12s;
  }
  .tcell:hover .tact{opacity:1;}
  .tact button{
    width:19px; height:19px; padding:0; border:0; border-radius:2px;
    background:rgba(29,25,23,.96); color:var(--ink); font-size:10px; line-height:1;
  }
  .tact button:hover{background:#2A2420; color:var(--red);}
  .thumbs .more-imgs{
    aspect-ratio:3/4; display:flex; align-items:center; justify-content:center;
    border:1px dashed var(--line); color:var(--faint); font-size:11px; background:#241F16;
  }
  .empty{padding:60px 0; text-align:center; color:var(--faint); font-size:13px; line-height:2;}

  /* ---------- 抽屉 ---------- */
  #drawer{
    position:fixed; top:0; right:0; width:430px; max-width:92vw; height:100%;
    background:var(--paper); border-left:1px solid var(--line); box-shadow:-10px 0 34px rgba(0,0,0,.10);
    transform:translateX(101%); transition:transform .22s ease; display:flex; flex-direction:column; z-index:30;
  }
  #drawer.open{transform:translateX(0);}
  .dhead{padding:16px 20px 13px; border-bottom:1px solid var(--line); display:flex; align-items:flex-start; justify-content:space-between;}
  .dhead b{font-size:17px; letter-spacing:.5px;}
  .dhead span{display:block; font-size:12px; color:var(--faint); margin-top:4px;}
  .dclose{border:0; background:transparent; font-size:20px; color:var(--faint); line-height:1;}
  .dclose:hover{color:var(--red);}
  .dbody{flex:1; overflow:auto; padding:14px 20px 30px;}
  .ecard{border:1px solid var(--line); padding:12px 13px; margin-bottom:11px; background:#1D1917;}
  .ecard.flashcard{outline:2px solid var(--gold); outline-offset:2px;}

  /* 抽屉里的任务清单：逐条编辑 / 删除 */
  .tasklist{border:1px solid var(--line); background:#1D1917; padding:9px 11px; margin-bottom:12px;}
  .tasklist .tlabel{font-size:10.5px; color:var(--faint); letter-spacing:.4px; margin-bottom:6px;}
  .trow{display:flex; align-items:center; gap:7px; padding:5px 0; border-top:1px solid #2C2622;}
  .trow:first-of-type{border-top:0;}
  .tdot{width:7px; height:7px; border-radius:50%; flex:0 0 auto;}
  .tname{
    flex:1; min-width:0; font-size:12.5px; font-weight:700; color:var(--ink);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .tmeta{font-size:10px; color:var(--faint); flex:0 0 auto;}
  .tsm{
    flex:0 0 auto; border:1px solid var(--line); background:var(--paper); color:var(--sub);
    font-size:10.5px; padding:2px 8px; border-radius:2px;
  }
  .tsm:hover{border-color:var(--gold); color:var(--red);}
  .tsm.del:hover{border-color:#C9303F; color:#C9303F;}
  .ecard .colors{display:flex; gap:6px; margin-bottom:8px;}
  .ecard .sw{width:16px; height:16px;}
  .ecard input.title{
    width:100%; border:0; border-bottom:1px solid var(--line); background:transparent; padding:4px 0 6px;
    font-size:14px; font-weight:700; color:var(--ink); outline:none;
  }
  .ecard input.title::placeholder{color:#6E635C; font-weight:400;}
  .ecard textarea{
    width:100%; border:0; background:transparent; resize:none; outline:none; margin-top:8px;
    font-size:12.5px; line-height:1.7; color:var(--sub); min-height:44px;
  }
  .ecard textarea::placeholder{color:#6E635C;}
  .eimgs{display:flex; flex-wrap:wrap; gap:8px; margin-top:9px;}
  .eimg{position:relative; width:62px; height:82px; background:#2C2622; border:1px solid var(--line);}
  .eimg img{width:60px; height:80px; object-fit:cover; display:block;}
  .eimg .iact{
    position:absolute; inset:0; display:flex; flex-direction:column; justify-content:flex-end; gap:2px;
    padding:3px; background:linear-gradient(rgba(0,0,0,0) 30%, rgba(0,0,0,.68));
    opacity:0; transition:opacity .12s;
  }
  .eimg:hover .iact{opacity:1;}
  .eimg .iact button{
    border:0; border-radius:2px; background:rgba(29,25,23,.96); color:var(--ink);
    font-size:9.5px; line-height:1.5; padding:1px 0;
  }
  .eimg .iact button:hover{background:#2A2420; color:var(--red);}
  .eimg.flash{outline:2px solid var(--red); outline-offset:1px;}
  .eimg.cur{outline:2px solid var(--gold); outline-offset:1px;}
  .eitools{display:flex; flex-wrap:wrap; gap:6px; margin-top:9px;}
  .eitools button{
    border:1px solid var(--line); background:var(--paper); color:var(--sub);
    font-size:10.5px; padding:3px 9px; border-radius:2px;
  }
  .eitools button:hover{border-color:var(--gold); color:var(--red);}
  .eitools span{font-size:10.5px; color:#6E635C; align-self:center; margin-left:auto;}
  .eadd{width:62px; height:62px; border:1px dashed var(--line); background:transparent; color:var(--faint); font-size:19px; line-height:1;}
  .eadd:hover{border-color:var(--gold); color:var(--red);}
  .epaste{
    height:62px; padding:0 10px; border:1px dashed var(--line); background:transparent; color:var(--faint);
    font-size:11px; line-height:1.5; border-radius:2px; text-align:center;
  }
  .epaste:hover{border-color:var(--gold); color:var(--red);}
  .ecard.dragover{outline:2px dashed var(--gold); outline-offset:2px; background:#241F16;}
  .pastehint{font-size:10.5px; color:#6E635C; margin-top:7px; line-height:1.6;}
  .daycol.dropon{box-shadow:inset 0 0 0 2px var(--gold);}
  .efoot{display:flex; justify-content:space-between; align-items:center; margin-top:10px;}
  .edel{border:0; background:transparent; color:#7B6F67; font-size:11.5px;}
  .edel:hover{color:var(--red);}
  .etime{font-size:11px; color:#6E635C;}
  .efoot .fright{display:flex; align-items:center; gap:10px;}
  .esubmit{
    border:0; background:var(--red); color:#FFF6EC; font-size:11.5px; font-weight:700;
    padding:6px 13px; border-radius:2px; letter-spacing:.6px;
  }
  .esubmit:hover{background:#E05563;}
  .esubmit.done{background:#3F7A52;}
  .nfoot{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:8px;}

  /* ---------- 页内确认弹窗（confirm 在嵌入环境下会被拦截） ---------- */
  .mask{
    position:fixed; inset:0; background:rgba(0,0,0,.34);
    display:flex; align-items:center; justify-content:center; z-index:60;
  }
  .mask .mbox{
    width:330px; max-width:88vw; background:var(--paper); border:1px solid var(--line);
    box-shadow:0 18px 50px rgba(0,0,0,.24); padding:20px 20px 16px;
  }
  .mask .mbox b{font-size:15px; letter-spacing:.5px;}
  .mask .mbox p{font-size:12.5px; color:var(--sub); line-height:1.8; margin:10px 0 18px;}
  .mask .mfoot{display:flex; justify-content:flex-end; gap:8px;}
  .mask .mfoot button{font-size:12.5px; padding:6px 16px; border-radius:2px;}
  .mask .mfoot .cancel{border:1px solid var(--line); background:transparent; color:var(--sub);}
  .mask .mfoot .ok{border:0; background:var(--red); color:#FFF6EC; font-weight:700;}
  .mask .mfoot .ok.safe{background:var(--ink); color:#12100E;}
  .dadd{width:100%; border:1px dashed var(--line); background:transparent; padding:10px; font-size:13px; color:var(--sub); border-radius:2px;}
  .dadd:hover{border-color:var(--gold); color:var(--red);}
  .dhint{font-size:11.5px; color:#6E635C; line-height:1.8; margin-top:12px;}

  #toast{
    position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px); background:var(--ink); color:#12100E;
    font-size:13px; padding:10px 18px; border-radius:2px; opacity:0; pointer-events:none; transition:all .2s; z-index:50;
  }
  #toast.on{opacity:1; transform:translate(-50%,0);}

  /* ---------- 图片编辑器 ---------- */
  #imgedit{position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.72); display:flex; align-items:center; justify-content:center;}
  #imgedit .ibox{width:430px; max-width:94vw; background:var(--paper); border:1px solid var(--line); box-shadow:0 20px 60px rgba(0,0,0,.3); padding:15px 16px 14px;}
  #imgedit .ihead{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  #imgedit .ihead b{font-size:14px;}
  #imgedit .ihead span{font-size:11px; color:var(--faint); margin-left:8px;}
  #imgedit .ihead button{border:0; background:transparent; font-size:18px; color:var(--faint); line-height:1; padding:0;}
  #imgedit .stage{height:330px; background:#2C2622; display:flex; align-items:center; justify-content:center; overflow:hidden;}
  #imgedit .stage canvas{max-width:100%; max-height:330px; display:block;}
  #imgedit .ctl{display:flex; align-items:center; gap:8px; margin-top:9px; font-size:11.5px; color:var(--sub);}
  #imgedit .ctl input[type=range]{flex:1; accent-color:#C9303F;}
  #imgedit .ctl .val{width:34px; text-align:right; color:var(--faint); font-size:10.5px;}
  #imgedit .irot{display:flex; gap:6px; margin-top:9px;}
  #imgedit .irot button{border:1px solid var(--line); background:var(--paper); color:var(--sub); font-size:11.5px; padding:4px 10px; border-radius:2px;}
  #imgedit .irot button:hover{border-color:var(--gold); color:var(--red);}
  #imgedit .ifoot{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:13px;}
  #imgedit .ifoot .r{display:flex; gap:8px;}
  #imgedit .ifoot button{font-size:12px; padding:6px 14px; border-radius:2px;}
  #imgedit .ifoot .cancel{border:1px solid var(--line); background:transparent; color:var(--sub);}
  #imgedit .ifoot .save{border:0; background:var(--red); color:#FFF6EC; font-weight:700;}
  #imgedit .ifoot .reset{border:0; background:transparent; color:var(--faint); font-size:11.5px; padding:0;}

  /* ---------- 项目标题行内编辑 ---------- */
  .brand{cursor:default;}
  .brand .btext{border-bottom:1px dashed transparent;}
  .brand:hover .btext{border-bottom-color:var(--line);}
  .brand input.bedit{
    border:0; border-bottom:1px solid var(--gold); background:#1D1917; outline:none;
    font-size:14px; font-weight:700; color:var(--ink); width:150px; padding:2px 4px;
  }

  /* ---------- 时间轴卡片：删除按钮 ---------- */
  .card{position:relative;}
  .card h4{padding-right:60px;}
  .card .cdel{
    position:absolute; right:10px; top:11px; border:1px solid var(--line); background:var(--paper);
    color:var(--sub); font-size:11px; padding:2px 9px; border-radius:2px; line-height:1.5;
  }
  .card .cdel:hover{border-color:var(--red); color:var(--red);}

  /* ---------- 卡片编辑：渠道 / 活动 / 图类型 ---------- */
  .meta-row{display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap;}
  .meta-row select, .meta-row input{
    border:1px solid var(--line); background:var(--paper); font-size:11.5px; padding:4px 6px;
    color:var(--ink); border-radius:2px; outline:none;
  }
  .meta-row select{flex:0 0 auto; max-width:130px;}
  .meta-row .meta-act{flex:1; min-width:150px;}
  .meta-row select:focus, .meta-row input:focus{border-color:var(--gold);}

  /* ---------- 分享弹窗 ---------- */
  .sharebox{width:370px;}
  .sharebox .share-link{display:flex; gap:6px; margin:12px 0 14px;}
  .sharebox .share-link input{
    flex:1; min-width:0; border:1px solid var(--line); background:#1D1917; padding:7px 9px;
    font-size:12px; color:var(--sub); border-radius:2px; outline:none;
  }
  .sharebox .share-grid{display:flex; gap:8px; flex-wrap:wrap;}
  .sharebox .share-grid button{
    flex:1 1 42%; display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:11px 6px 9px; font-size:13.5px; font-weight:700; color:var(--ink);
  }
  .sharebox.galshare{width:430px;}
  .sharebox .share-grid button small{font-size:10.5px; font-weight:400; color:var(--faint);}
  .sharebox .share-note{font-size:11px; color:#6E635C; line-height:1.7; margin-top:12px;}
  .sharebox .mfoot .done{border:1px solid var(--line); background:var(--paper); color:var(--sub);}

  /* ---------- 数据统计 ---------- */
  .stats-tbl{width:100%; border-collapse:collapse; background:var(--paper); border:1px solid var(--line); font-size:12.5px;}
  .stats-tbl th{
    background:var(--red); color:#FFF6EC; font-weight:600; padding:9px 10px; text-align:left;
    letter-spacing:.5px; font-size:12.5px; white-space:nowrap;
  }
  .stats-tbl td{border-top:1px solid var(--line); padding:7px 10px; vertical-align:middle;}
  .stats-tbl tbody tr:hover td{background:#1D1917;}
  .stats-tbl .num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .stats-tbl td input{
    border:1px solid transparent; background:transparent; padding:3px 5px; font-size:12.5px;
    color:var(--ink); width:100%; min-width:70px; outline:none; border-radius:2px; font-family:inherit;
  }
  .stats-tbl td select{
    border:1px solid var(--line); background:#1D1917; padding:3px 6px; font-size:12.5px;
    color:var(--ink); outline:none; border-radius:2px; max-width:150px;
  }
  .stats-tbl td select:focus{border-color:var(--gold);}
  .stats-tbl td input:hover{border-color:var(--line);}
  .stats-tbl td input:focus{border-color:var(--gold); background:#2A2420;}
  .stats-tbl .rowdel{border:1px solid var(--line); background:var(--paper); color:var(--sub); font-size:11px; padding:2px 8px; border-radius:2px; white-space:nowrap;}
  .timbtn{border:1px solid transparent; background:transparent; color:var(--ink); font-size:12.5px; padding:3px 10px; border-radius:2px; cursor:pointer; font-family:inherit;}
  .timbtn:hover{border-color:var(--line); background:#2A2420;}
  .timbtn.empty{color:var(--faint);}
  .stats-tbl .rowdel:hover{border-color:var(--red); color:var(--red);}
  .stats-tbl .rowdl{border:1px solid var(--line); background:var(--paper); color:var(--sub); font-size:11px; padding:2px 8px; border-radius:2px; white-space:nowrap; margin-right:5px;}
  .stats-tbl .rowdl:hover{border-color:var(--gold); color:var(--red);}
  .stats-tbl tfoot td{font-weight:700; background:#221C17; border-top:2px solid var(--gold);}
  .stats-note{font-size:11.5px; color:var(--faint); line-height:1.8; margin-top:10px;}

  /* ---------- 系统切换 ---------- */
  .sysbtn{
    display:flex; align-items:center; gap:6px; border:1px solid var(--line); background:#1D1917;
    color:var(--ink); font-size:12px; padding:6px 10px; border-radius:2px; max-width:190px; white-space:nowrap;
  }
  .sysbtn:hover{border-color:var(--gold); color:var(--red);}
  .sysbtn span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .sysmenu{
    position:fixed; z-index:75; width:240px; background:var(--paper); border:1px solid var(--line);
    box-shadow:0 14px 36px rgba(0,0,0,.20); padding:8px;
  }
  .sysmenu .mi{
    display:flex; align-items:center; gap:8px; width:100%; border:0; background:transparent;
    padding:9px 8px; font-size:13px; color:var(--ink); text-align:left; border-radius:2px; cursor:pointer;
  }
  .sysmenu .mi:hover{background:var(--soft);}
  .sysmenu .mi.on{font-weight:700; color:var(--red);}
  .sysmenu .mi .del{margin-left:auto; border:0; background:transparent; color:#6E635C; font-size:12px; padding:2px 4px;}
  .sysmenu .mi .del:hover{color:var(--red);}
  .sysmenu .mnew{border-top:1px solid #2C2622; margin-top:4px; padding-top:4px;}

  /* ---------- 问题收集 ---------- */
  .mask .mbox.issuesbox{width:880px; max-width:96vw; padding:22px 26px 18px;}
  .issuesbox .ibody{max-height:72vh; overflow-y:auto; margin:14px 0;}
  .issue{padding:13px 15px; margin-bottom:12px;}
  .issuesbox .ibody{max-height:72vh; overflow-y:auto; margin:14px 0;}
  .tag{
    display:inline-flex; align-items:center; border-radius:2px; font-size:10.5px; padding:2px 8px;
    border:1px solid var(--line); background:var(--paper); color:var(--sub); line-height:1.5;
  }
  .tag.open{border-color:#C9303F; color:#C9303F; background:#2C1A1A;}
  .tag.doing{border-color:#D9B166; color:#D9B166; background:#FDF8EC;}
  .tag.solved{border-color:#4E9A76; color:#4E9A76; background:#EFF7F1;}
  .issue{
    border:1px solid var(--line); background:#1D1917; padding:10px 12px; margin-bottom:10px;
  }
  .issue .itop{display:flex; align-items:center; gap:8px; margin-bottom:6px; flex-wrap:wrap;}
  .issue .itop input{
    flex:1; min-width:140px; border:0; border-bottom:1px solid var(--line); background:transparent;
    font-size:14px; font-weight:700; padding:4px 0; outline:none; color:var(--ink);
  }
  .issue .itop input::placeholder{color:#6E635C; font-weight:400;}
  .issue textarea, .issue .sol textarea{
    width:100%; border:0; border-top:1px dashed #2C2622; background:transparent; resize:none; outline:none;
    font-size:12px; line-height:1.7; color:var(--sub); min-height:36px; padding-top:6px; margin-top:4px;
  }
  .issue .tags{display:flex; gap:5px;}
  .issue .tags button{border:1px solid var(--line); background:var(--paper); color:var(--sub); font-size:10.5px; padding:2px 8px; border-radius:2px;}
  .issue .tags button.on.open{border-color:#C9303F; color:#C9303F; background:#2C1A1A; font-weight:700;}
  .issue .tags button.on.doing{border-color:#D9B166; color:#D9B166; background:#FDF8EC; font-weight:700;}
  .issue .tags button.on.solved{border-color:#4E9A76; color:#4E9A76; background:#EFF7F1; font-weight:700;}
  .issue .sols{margin-top:6px; border-top:1px solid #2C2622; padding-top:4px;}
  .issue .solhead{font-size:10.5px; color:var(--faint); letter-spacing:.4px; margin:4px 0 2px;}
  .issue .sol{border-left:3px solid var(--gold); background:#221C17; padding:6px 9px; margin:6px 0;}
  .issue .sol .sfoot{display:flex; justify-content:space-between; align-items:center; margin-top:2px;}
  .issue .addsol{
    border:1px dashed var(--line); background:transparent; color:var(--sub); font-size:11px;
    padding:4px 10px; border-radius:2px; margin-top:2px;
  }
  .issue .addsol:hover{border-color:var(--gold); color:var(--red);}
  .issue .ifoot{display:flex; justify-content:space-between; align-items:center; margin-top:6px;}
  .issue .ifilt{display:flex; gap:6px; align-items:center; margin-bottom:10px; flex-wrap:wrap;}

  /* ---------- 统计：筛选 chips / 行多选 / 图表 ---------- */
  .chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; align-items:center;}
  .chip{
    display:inline-flex; align-items:center; gap:5px; border:1px solid #F2EAE1; background:transparent;
    color:#F2EAE1; font-size:12px; padding:4px 10px; border-radius:14px;
  }
  .chip:hover{border-color:#FFF9F0; color:#FFF9F0; background:rgba(255,249,240,.08);}
  .chip .x{border:0; background:transparent; color:#C4B8AC; font-size:11px; padding:0 0 0 2px; line-height:1;}
  .chip .x:hover{color:var(--red);}
  .chip .x.hide{visibility:hidden;}
  .chip.on{border-color:var(--red); color:#FFF9F0; background:var(--red); font-weight:600;}
  .chip.on .x{color:rgba(255,249,240,.85);}
  .chip.on .x:hover{color:#FFF9F0;}
  .chip-add{border:1px dashed var(--line); background:transparent; color:var(--sub); font-size:12px; padding:4px 10px; border-radius:14px;}
  .chip-add:hover{border-color:var(--gold); color:var(--red);}
  .stats-tbl td.cbx{width:30px; text-align:center;}
  .chartbox{border:1px solid var(--line); background:var(--paper); margin-top:16px; padding:14px 16px; position:relative;}
  .stat-block{border:1px solid var(--line); background:var(--paper); margin-top:16px; padding:14px 16px;}
  .stat-block .chips{margin:4px 0 0;}
  .stat-block .stats-tbl{margin-top:14px;}
  .stat-block .empty{padding:34px 0;}
  .chartbox .chead{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; flex-wrap:wrap; gap:8px;}
  .chartbox .chead b{font-size:14px;}
  .chartbox canvas{width:100%; max-width:900px; height:320px; display:block; cursor:default;}
  .chart-tip{
    position:absolute; z-index:5; pointer-events:none; display:none; min-width:150px;
    background:#2A2420; border:1px solid var(--gold); color:var(--ink); font-size:12px; line-height:1.7;
    padding:8px 11px; box-shadow:0 10px 26px rgba(0,0,0,.35); border-radius:2px; white-space:nowrap;
  }
  .chart-tip b{font-size:12.5px;}
  .chart-tip .row{display:flex; align-items:center; gap:6px;}
  .chart-tip .dot{width:8px; height:8px; border-radius:2px; display:inline-block; flex:0 0 auto;}
  .chart-tip .dim{color:var(--faint); font-size:11px; margin-top:3px;}

  /* ---------- 行内输入弹窗 ---------- */
  .inputbox .iin{
    width:100%; border:1px solid var(--line); background:#1D1917; padding:8px 10px; font-size:13px;
    color:var(--ink); outline:none; margin:10px 0 16px; border-radius:2px;
  }
  .inputbox .iin:focus{border-color:var(--gold);}

  @media (max-width:900px){
    #topbar{height:auto; flex-wrap:wrap; padding:9px 12px; gap:9px;}
    #tabs{order:5; flex-basis:100%; -webkit-overflow-scrolling:touch;}
    #main{height:calc(100% - 104px); padding:12px;}
    .daycol{flex-basis:128px;}
  }
  @media (max-width:720px){
    .tools{flex-wrap:wrap; justify-content:flex-end;}
    .tools .ghost{padding:6px 9px; font-size:12px;}
    #main{padding:10px 8px 40px;}
    .view-head{flex-direction:column; align-items:flex-start; gap:8px;}
    .tl-row{flex-direction:column; gap:8px;}
    .tl-date{width:auto; display:flex; align-items:baseline; gap:8px;}
    .tl-cards{grid-template-columns:1fr !important;}
    #drawer{width:100vw; max-width:100vw;}
    .dhead{padding:14px 14px 11px;}
    .dbody{padding:12px 14px 26px;}
    .stats-tbl{display:block; overflow-x:auto; -webkit-overflow-scrolling:touch;}
    .stats-tbl th, .stats-tbl td{white-space:nowrap;}
    .chartbox{padding:10px;}
    .chartbox canvas{height:240px;}
    .issuesbox{width:96vw;}
    .mask{align-items:flex-end; padding-bottom:0;}
    .mask .mbox{width:100vw; max-width:100vw; border-left:0; border-right:0; max-height:92vh; overflow-y:auto;}
    .brand{font-size:13px;}
    .brand input.bedit{width:120px;}
  }
/* ---------- 语音输入悬浮麦克风 ---------- */
  #micFab{
    position:fixed; z-index:96; width:26px; height:26px; border-radius:50%;
    border:1px solid var(--line); background:#241E19; color:var(--gold);
    display:none; align-items:center; justify-content:center; font-size:13px; line-height:1;
    box-shadow:0 3px 12px rgba(0,0,0,.55); padding:0;
  }
  #micFab.show{display:flex;}
  #micFab:hover{border-color:var(--gold); color:#FFD79A;}
  #micFab.on{background:var(--red); border-color:var(--red); color:#fff; animation:micPulse 1.3s infinite;}
  @keyframes micPulse{
    0%,100%{box-shadow:0 0 0 0 rgba(201,48,63,.55);}
    50%{box-shadow:0 0 0 8px rgba(201,48,63,0);}
  }
  #micTip{
    position:fixed; z-index:96; max-width:280px; padding:5px 9px; font-size:11.5px;
    background:#2A2420; color:#F2EAE1; border:1px solid var(--line); border-radius:3px;
    display:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #micTip.show{display:block;}

  /* ---------- 花瓣收录集 ---------- */
  .galwrap{position:relative; padding:20px 22px 46px; min-height:100%;}
  .galwrap.dragging::after{
    content:'松手即可收录到相册'; position:absolute; inset:10px; z-index:3; pointer-events:none;
    border:2px dashed var(--gold); border-radius:4px; display:flex; align-items:center; justify-content:center;
    color:var(--gold); font-size:14px; background:rgba(14,12,11,.55);
  }
  .galhead{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px;}
  .galhead-left b{font-size:16px;}
  .galhead-left small{display:block; color:var(--faint); font-size:11.5px; margin-top:5px;}
  .galnav{display:flex; gap:8px; flex-wrap:wrap;}
  .galnav button{border:1px solid var(--line); background:var(--raise); color:var(--sub); font-size:12.5px; padding:7px 12px; border-radius:2px;}
  .galnav button:hover{border-color:var(--gold); color:var(--ink);}
  .galnav button.danger{color:var(--red);}
  .galnav button.danger:hover{border-color:var(--red); color:var(--red);}
  .galgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px;}
  .galcard{position:relative; background:var(--paper); border:1px solid var(--line); border-radius:3px; overflow:hidden; transition:border-color .15s;}
  .galcard.on{border-color:var(--red); box-shadow:0 0 0 1px var(--red);}
  .galthumb{height:150px; background:var(--soft); display:flex; align-items:center; justify-content:center; overflow:hidden; cursor:zoom-in;}
  .galthumb img{max-width:100%; max-height:100%; object-fit:contain; display:block;}
  .galcb{
    position:absolute; top:8px; left:8px; width:24px; height:24px; border-radius:50%; padding:0;
    border:1px solid var(--line); background:rgba(14,12,11,.78); color:transparent; font-size:12.5px; line-height:1;
  }
  .galcard.on .galcb{background:var(--red); border-color:var(--red); color:#FFF6EC;}
  .galfoot{padding:8px 10px 10px;}
  .galname{font-size:12px; color:var(--sub); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer;}
  .galname:hover{color:var(--ink); text-decoration:underline;}
  .galacts{display:flex; gap:6px; margin-top:8px;}
  .galbtn{flex:1; border:1px solid var(--line); background:var(--raise); color:var(--sub); font-size:11.5px; padding:5px 0; border-radius:2px; white-space:nowrap;}
  .galbtn:hover{border-color:var(--red); color:var(--ink);}
  .gal-empty{grid-column:1/-1; text-align:center; color:var(--faint); padding:70px 0; line-height:2;}
  .gal-empty div:first-child{font-size:15px; color:var(--sub);}

  /* 花瓣大图预览 */
  #galview{position:fixed; inset:0; z-index:210; background:rgba(8,6,5,.93); display:flex; align-items:center; justify-content:center;}
  #galview>img{max-width:82vw; max-height:76vh; object-fit:contain; box-shadow:0 14px 48px rgba(0,0,0,.65);}
  .gvcap{position:absolute; left:50%; bottom:70px; transform:translateX(-50%); color:var(--sub); font-size:12.5px; max-width:70vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .gvarrow{position:absolute; top:50%; transform:translateY(-50%); width:46px; height:64px; border:1px solid var(--line); background:rgba(23,20,19,.85); color:var(--ink); font-size:26px; line-height:1;}
  .gvarrow.l{left:18px;}
  .gvarrow.r{right:18px;}
  .gvarrow:hover{border-color:var(--gold);}
  .gvclose{position:absolute; top:14px; right:18px; border:0; background:transparent; color:var(--sub); font-size:30px; line-height:1;}
  .gvclose:hover{color:var(--ink);}
  .gvbar{position:absolute; left:50%; bottom:18px; transform:translateX(-50%); display:flex; gap:10px;}
  .gvbtn{border:1px solid var(--line); background:var(--paper); color:var(--ink); font-size:13px; padding:8px 18px; border-radius:2px;}
  .gvbtn:hover{border-color:var(--red);}
</style>
</head>
<body>
<div id="topbar">
  <div class="brand" id="brand" title="双击可修改系统名称"><span class="dot"></span><span class="btext" id="brandText">诺康莱集团设计中台管理系统</span></div>
  <button class="sysbtn" id="sysBtn" title="切换 / 新建系统"><span id="sysName">诺康莱集团设计中台</span><em style="font-style:normal;color:var(--faint)">▾</em></button>
  <div id="tabs"></div>
  <div class="tools">
    <div class="seg" id="viewSeg">
      <button data-v="strip">横向日历</button>
      <button data-v="timeline">时间轴</button>
      <button data-v="stats">数据统计</button>
      <button data-v="gallery">花瓣收录集</button>
    </div>
    <button class="ghost" id="issuesBtn" title="记录设计问题与解决方案">问题收集</button>
    <button class="ghost" id="shareBtn">复制分享链接</button>
    <div class="sync" id="sync"><i></i><em style="font-style:normal">已同步</em></div>
  </div>
</div>

<div id="main"></div>
<aside id="drawer"></aside>
<div id="toast"></div>

<script>
(function(){
  'use strict';

  /* 全站唯一色板：赤橙黄绿青蓝紫黑白灰（任务色 / 日期标色 / 备注色 / 图表色 共用） */
  var COLORS = [
    {id:'red',    hex:'#C0392B', name:'赤'},
    {id:'orange', hex:'#E07B39', name:'橙'},
    {id:'yellow', hex:'#D9A93B', name:'黄'},
    {id:'green',  hex:'#4E8B57', name:'绿'},
    {id:'cyan',   hex:'#3E8E8E', name:'青'},

  function normColor(id){ return LEGACY_COLOR[id] || id; }
  /* 统计渠道：动态（服务端同步，可在「数据统计」里增删） */
  var DEFAULT_CHANNELS = [

  var curBoardId = localStorage.getItem('pb.board') || '';

  var $tabs = document.getElementById('tabs');

  var $sync = document.getElementById('sync');
  var $toast = document.getElementById('toast');

  /* ---------- 工具 ---------- */
  function uid(p){ return (p||'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function pad(n){ return n < 10 ? '0' + n : '' + n; }
  function ymd(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
  function parseYmd(s){ var p = (s||'').split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function addDays(d, n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function todayStr(){ return ymd(new Date()); }
  function hexOf(id){
    var k = normColor(id), i;
    for (i=0;i<COLORS.length;i++) if (COLORS[i].id === k) return COLORS[i].hex;
    return '#8A8A85';
  }
  function tint(hex, a){
    var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }
  function isEditing(){
    var a = document.activeElement;
    return !!(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA'));
  }
  function toast(msg){
    $toast.textContent = msg;
    $toast.classList.add('on');
    clearTimeout($toast._t);
    $toast._t = setTimeout(function(){ $toast.classList.remove('on'); }, 1900);
  }
  function el(tag, cls, txt){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt != null) n.textContent = txt;
    return n;
  }
  function fmtStamp(ts){
    var d = new Date(ts || Date.now());
    return pad(d.getMonth()+1) + '/' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function daysBetween(a, b){
    if (!a || !b) return 0;
    return Math.round((parseYmd(b) - parseYmd(a)) / 86400000) + 1;
  }

  /* 动态渠道列表（含兜底：未同步到数据前用默认 8 项） */
  function channelNames(){
    var live = (S.channels || []).filter(function(c){ return c && !c.deleted && c.name; });
    if (!live.length) return DEFAULT_CHANNELS.slice();
    return live.map(function(c){ return c.name; });
  }
  function designerNames(){
    return (S.designers || []).filter(function(d){ return d && !d.deleted && d.name; })
      .map(function(d){ return d.name; });
  }
  function contactNames(){
    return (S.contacts || []).filter(function(d){ return d && !d.deleted && d.name; })
      .map(function(d){ return d.name; });
  }
  function liveSystems(){
    return (S.systems || []).filter(function(s){ return s && !s.deleted; });
  }
  function currentSystem(){
    var ss = liveSystems();
    for (var i=0;i<ss.length;i++) if (ss[i].id === curSystemId) return ss[i];
    return ss[0] || null;
  }

  /* 行内输入弹窗（prompt 在嵌入环境会被拦截，统一用这个） */
  function askInput(title, placeholder, value, okText, cb){
    var mask = el('div', 'mask');
    var box = el('div', 'mbox inputbox');
    box.appendChild(el('b', null, title));
    var inp = document.createElement('input');
    inp.className = 'iin'; inp.placeholder = placeholder || '';
    inp.value = value || '';
    box.appendChild(inp);
    var foot = el('div', 'mfoot');
    var cancel = el('button', 'cancel', '取消');
    var ok = el('button', 'ok safe', okText || '确定');
    function close(){
      if (mask.parentNode) mask.parentNode.removeChild(mask);
      document.removeEventListener('keydown', onKey, true);
    }
    function onKey(e){ if (e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); close(); } }
    function commit(){ close(); cb(inp.value.trim(), true); }
    cancel.addEventListener('click', close);
    ok.addEventListener('click', commit);
    inp.addEventListener('keydown', function(e){
      if (e.key === 'Enter'){ e.preventDefault(); commit(); }
    });
    foot.appendChild(cancel); foot.appendChild(ok);
    box.appendChild(foot);
    mask.appendChild(box);
    mask.addEventListener('click', function(e){ if (e.target === mask) close(); });
    document.addEventListener('keydown', onKey, true);
    document.body.appendChild(mask);
    setTimeout(function(){ try { inp.focus(); inp.select(); } catch(e){} }, 30);
  }

  /* 时间选择弹框：选择活动的开始与结束时间 */
  function askDateRange(title, start, end, cb){
    var mask = el('div', 'mask');
    var box = el('div', 'mbox inputbox');
    box.appendChild(el('b', null, title));
    var wrap = el('div');
    wrap.style.cssText = 'display:flex; align-items:center; gap:10px; margin:14px 0 18px;';
    function mkDate(v){
      var d = document.createElement('input');
      d.type = 'date'; d.value = v || '';
      d.style.cssText = 'flex:1; min-width:130px; border:1px solid var(--line); background:var(--paper); color:var(--ink); font-size:13px; padding:7px 8px; border-radius:2px; outline:none; color-scheme:dark;';
      return d;
    }
    var dStart = mkDate(start), dEnd = mkDate(end);
    wrap.appendChild(dStart);
    wrap.appendChild(el('span', null, '至'));
    wrap.appendChild(dEnd);
    box.appendChild(wrap);
    var foot = el('div', 'mfoot');
    var cancel = el('button', 'cancel', '取消');
    var ok = el('button', 'ok', '确定');
    function close(){
      if (mask.parentNode) mask.parentNode.removeChild(mask);
      document.removeEventListener('keydown', onKey, true);
    }
    function onKey(e){ if (e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); close(); } }
    function commit(){
      var s = dStart.value, e = dEnd.value;
      if (s && e && s > e){ toast('开始时间不能晚于结束时间'); return; }
      close(); cb(s, e, true);
    }
    cancel.addEventListener('click', close);
    ok.addEventListener('click', commit);
    foot.appendChild(cancel); foot.appendChild(ok);
    box.appendChild(foot);
    mask.appendChild(box);
    mask.addEventListener('click', function(ev){ if (ev.target === mask) close(); });
    document.addEventListener('keydown', onKey, true);
    document.body.appendChild(mask);
    setTimeout(function(){ try { dStart.focus(); } catch(e){} }, 30);
  }

  /* 同步后 S.boards 会被服务端版本整体替换，闭包里持有的旧对象会失效。
     所有写操作前都用 id 重新取一次当前对象，避免“改了看不到”。 */
  function findCard(b, id){
    var l = (b && b.cards) || [];
    for (var i=0;i<l.length;i++) if (l[i].id === id && !l[i].deleted) return l[i];
    return null;
  }
  function findNote(b, id){
    var l = (b && b.notes) || [];
    for (var i=0;i<l.length;i++) if (l[i].id === id && !l[i].deleted) return l[i];
    return null;
  }
  /* 同一页面在 S.boards 里可能是被替换过的新对象，按 id 取回当前那份 */
  function liveBoard(b){
    if (!b) return board();
    for (var i=0;i<S.boards.length;i++) if (S.boards[i].id === b.id && !S.boards[i].deleted) return ensure(S.boards[i]);
    return b;
  }

  /* 页内确认框：浏览器自带的 confirm() 在嵌入预览/部分浏览器里会被静默拦截 */
  function askConfirm(msg, okText, cb){
    var mask = el('div', 'mask');
    var box = el('div', 'mbox');
    box.appendChild(el('b', null, '请确认'));
    box.appendChild(el('p', null, msg));
    var foot = el('div', 'mfoot');
    var cancel = el('button', 'cancel', '取消');
    var ok = el('button', 'ok' + (/删除/.test(okText || '') ? '' : ' safe'), okText || '确定');
    function close(){
      if (mask.parentNode) mask.parentNode.removeChild(mask);
      document.removeEventListener('keydown', onKey, true);
    }
    function onKey(e){
      if (e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); close(); }
    }
    cancel.addEventListener('click', close);
    ok.addEventListener('click', function(){ close(); if (cb) cb(); });
    mask.addEventListener('click', function(e){ if (e.target === mask) close(); });
    foot.appendChild(cancel); foot.appendChild(ok);
    box.appendChild(foot);
    mask.appendChild(box);
    document.body.appendChild(mask);
    document.addEventListener('keydown', onKey, true);
    setTimeout(function(){ try { ok.focus(); } catch(e){} }, 30);
  }

  /* ---------- 数据 ---------- */
  function ensure(b){
    if (!b) return b;
    if (!b.cards) b.cards = [];
    if (!b.notes) b.notes = [];
    if (!b.dateColors) b.dateColors = {};
    if (!b.stripStart) b.stripStart = '';
    return b;
  }
  function board(){
    for (var i=0;i<S.boards.length;i++){
      if (S.boards[i].id === curBoardId && !S.boards[i].deleted) return ensure(S.boards[i]);
    }
    for (var j=0;j<S.boards.length;j++) if (!S.boards[j].deleted) { curBoardId = S.boards[j].id; return ensure(S.boards[j]); }
    return null;
  }
  function liveBoards(){ return S.boards.filter(function(b){ return !b.deleted; }); }
  function sysBoards(){
    var sys = currentSystem();
    return liveBoards().filter(function(b){ return !sys || !b.systemId || b.systemId === sys.id; });
  }
  function cardsOf(b, date){
    return (b.cards || []).filter(function(c){ return !c.deleted && (!date || c.date === date); })
      .sort(function(x,y){ return (x.order||0) - (y.order||0) || (x.updatedAt||0) - (y.updatedAt||0); });
  }
  function notesOf(b){
    return (b.notes || []).filter(function(n){ return !n.deleted; })
      .sort(function(x,y){ return (x.createdAt||0) - (y.createdAt||0); });
  }
  function notesOn(b, ds){
    return notesOf(b).filter(function(n){ return n.date === ds; });
  }
  function colorOfDate(b, ds){
    var rec = b.dateColors && b.dateColors[ds];
    if (!rec) return null;
    if (typeof rec === 'string') return rec;
    return rec.color || null;
  }
  function stripStartOf(b){
    if (b.stripStart) return parseYmd(b.stripStart);
    var all = cardsOf(b);
    if (all.length){
      var min = all[0].date;
      all.forEach(function(c){ if (c.date < min) min = c.date; });
      return addDays(parseYmd(min), -2);
    }
    return addDays(new Date(), -3);
  }

  /* ---------- 保存 / 同步 ---------- */
  function touchBoard(b){ b.updatedAt = Date.now(); scheduleSave(); }
  function scheduleSave(){
    saving = true;
    $sync.classList.add('saving');
    $sync.querySelector('em').textContent = '保存中';
    clearTimeout(pushTimer);
    pushTimer = setTimeout(push, 550);
  }
  function push(){
    return fetch('/api/state', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({state:S})
    }).then(function(r){ return r.json(); }).then(function(next){
      if (!next || !next.boards) return false;
      var editing = isEditing();
      S.version = next.version;
      saving = false;
      $sync.classList.remove('saving');
      $sync.querySelector('em').textContent = '已同步';
      if (editing) { pendingApply = true; return true; }
      S.boards = next.boards; S.boards.forEach(ensure);
      S.stats = Array.isArray(next.stats) ? next.stats : [];
      S.title = next.title || S.title;
      S.systems = Array.isArray(next.systems) ? next.systems : S.systems;
      S.channels = Array.isArray(next.channels) ? next.channels : S.channels;
      S.designers = Array.isArray(next.designers) ? next.designers : S.designers;
      S.contacts = Array.isArray(next.contacts) ? next.contacts : S.contacts;
      S.issues = Array.isArray(next.issues) ? next.issues : S.issues;
      S.gallery = Array.isArray(next.gallery) ? next.gallery : S.gallery;
      applySystemName();
      renderTabs(); renderMain();
      return true;
    }).catch(function(){
      saving = false;
      $sync.classList.remove('saving');
      $sync.querySelector('em').textContent = '网络异常';
      return false;
    });
  }
  /* 立即保存（点「提交」时用），不等防抖 */
  function pushNow(){
    clearTimeout(pushTimer);
    saving = true;
    $sync.classList.add('saving');
    $sync.querySelector('em').textContent = '保存中';
    return push();
  }
  function pull(){
    fetch('/api/state', {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(next){
      if (!next || !next.boards) return;
      if (next.version === S.version) return;
      if (saving) return;
      if (isEditing()) { pendingApply = true; return; }
      S.version = next.version;
      S.boards = next.boards; S.boards.forEach(ensure);
      S.stats = Array.isArray(next.stats) ? next.stats : [];
      S.systems = Array.isArray(next.systems) ? next.systems : S.systems;
      S.channels = Array.isArray(next.channels) ? next.channels : S.channels;
      S.designers = Array.isArray(next.designers) ? next.designers : S.designers;
      S.contacts = Array.isArray(next.contacts) ? next.contacts : S.contacts;
      S.issues = Array.isArray(next.issues) ? next.issues : S.issues;
      S.gallery = Array.isArray(next.gallery) ? next.gallery : S.gallery;
      applySystemName();
      renderTabs(); renderMain();
      if (drawerDate) renderDrawer();
    }).catch(function(){});
  }
  document.addEventListener('focusout', function(){
    setTimeout(function(){
      if (!isEditing() && pendingApply){
        pendingApply = false;
        renderTabs(); renderMain();
        if (drawerDate) renderDrawer();
      }
    }, 60);
  });

  /* ---------- 顶栏 ---------- */
  function renderTabs(){
    $tabs.innerHTML = '';
    var sys = currentSystem();
    document.getElementById('sysName').textContent = sys ? sys.name : '';
    applySystemName();
    sysBoards().forEach(function(b){
      var t = el('button', 'tab' + (b.id === curBoardId ? ' active' : ''));
      t.appendChild(el('span', null, b.name || '未命名'));
      var x = el('span', 'x', '×');
      x.addEventListener('click', function(ev){
        ev.stopPropagation();
        if (sysBoards().length <= 1){ toast('当前系统至少要保留一个页面'); return; }
        askConfirm('删除页面「' + (b.name||'未命名') + '」？其中的排期与备注会一起删除。', '删除页面', function(){
          b.deleted = true; b.updatedAt = Date.now();
          if (curBoardId === b.id) curBoardId = '';
          scheduleSave(); renderTabs(); renderMain();
        });
      });
      t.appendChild(x);
      t.addEventListener('click', function(){
        curBoardId = b.id;
        localStorage.setItem('pb.board', curBoardId);
        sel = { anchor:null, set:{} };
        drawerDate = null; $drawer.classList.remove('open');
        renderTabs(); renderMain();
      });
      t.addEventListener('dblclick', function(){
        var name = prompt('页面名称', b.name || '');
        if (name === null) return;
        b.name = name.trim() || '未命名';
        b.updatedAt = Date.now();
        scheduleSave(); renderTabs(); renderMain();
      });
      $tabs.appendChild(t);
    });
    var add = el('button', 'tab-add', '+');
    add.title = '新建页面';
    add.addEventListener('click', function(){
      var name = prompt('新页面名称', '新排期');
      if (name === null) return;
      var sys = currentSystem();
      var nb = ensure({
        id: uid('board'), name: (name.trim() || '新排期'), columns: 2,
        systemId: sys ? sys.id : 'sys_main',
        stripStart: '', createdAt: Date.now(), updatedAt: Date.now(), deleted:false,
        cards: [], notes: [], dateColors: {}
      });
      S.boards.push(nb);
      curBoardId = nb.id;
      localStorage.setItem('pb.board', curBoardId);
      sel = { anchor:null, set:{} };
      scheduleSave(); renderTabs(); renderMain();
    });
    $tabs.appendChild(add);

    var vs = document.querySelectorAll('#viewSeg button');
    for (var i=0;i<vs.length;i++) vs[i].classList.toggle('on', vs[i].getAttribute('data-v') === view);
  }
  /* 页签过多时支持按住左右拖动浏览 */
  (function(){
    var down = false, sx = 0, sl = 0, moved = false;
    $tabs.addEventListener('pointerdown', function(e){
      if (e.button !== 0) return;
      down = true; moved = false; sx = e.clientX; sl = $tabs.scrollLeft;
    });
    $tabs.addEventListener('pointermove', function(e){
      if (!down) return;
      var dx = e.clientX - sx;
      if (Math.abs(dx) > 4) moved = true;
      $tabs.scrollLeft = sl - dx;
    });
    ['pointerup','pointercancel','pointerleave'].forEach(function(ev){
      $tabs.addEventListener(ev, function(){ down = false; });
    });
  })();

  document.getElementById('viewSeg').addEventListener('click', function(e){
    var v = e.target.getAttribute('data-v');
    if (!v) return;
    view = v; localStorage.setItem('pb.view', view);
    renderTabs(); renderMain();
  });
  /* ---------- 品牌名 = 当前系统名：双击行内修改，全端同步 ---------- */
  function applySystemName(){
    var sys = currentSystem();
    var txt = sys && sys.name ? sys.name : '诺康莱集团设计中台管理系统';
    var span = document.getElementById('brandText');
    if (span) span.textContent = txt;
    document.title = txt;
  }
  document.getElementById('brand').addEventListener('dblclick', function(ev){
    ev.stopPropagation();
    var span = document.getElementById('brandText');
    if (span.parentNode.querySelector('input.bedit')) return;
    var sys = currentSystem();
    var input = document.createElement('input');
    input.className = 'bedit';
    input.value = (sys && sys.name) || '诺康莱集团设计中台管理系统';
    span.style.display = 'none';
    span.parentNode.insertBefore(input, span);
    input.focus(); input.select();
    var done = false;
    function cleanup(){
      if (done) return;
      done = true;
      if (input.parentNode) input.parentNode.removeChild(input);
      span.style.display = '';
    }
    function commit(){
      if (done) return;
      var v = input.value.trim() || '诺康莱集团设计中台管理系统';
      if (sys){ sys.name = v; sys.updatedAt = Date.now(); }
      applySystemName();
      renderTabs();
      scheduleSave();
      toast('系统名称已改为「' + v + '」，并同步给同事');
      cleanup();
    }
    input.addEventListener('keydown', function(e){
      if (e.key === 'Enter') commit();
      if (e.key === 'Escape') cleanup();
    });
    input.addEventListener('blur', commit);
  });

  /* ---------- 系统切换 / 新建（多系统平台化） ---------- */
  function switchSystem(id){
    curSystemId = id;
    localStorage.setItem('pb.system', id);
    var sb = sysBoards();
    curBoardId = sb.length ? sb[0].id : '';
    localStorage.setItem('pb.board', curBoardId);
    sel = { anchor:null, set:{} };
    drawerDate = null; $drawer.classList.remove('open');
    renderTabs(); renderMain();
  }
  function closeSysMenu(){
    var m = document.querySelector('.sysmenu');
    if (m && m.parentNode) m.parentNode.removeChild(m);
    document.removeEventListener('pointerdown', sysDocDown, true);
    document.removeEventListener('keydown', sysEsc, true);
  }
  function sysDocDown(e){
    var m = document.querySelector('.sysmenu');
    if (m && !m.contains(e.target)) closeSysMenu();
  }
  function sysEsc(e){ if (e.key === 'Escape') closeSysMenu(); }
  document.getElementById('sysBtn').addEventListener('click', function(){
    closeSysMenu();
    var menu = el('div', 'sysmenu');
    var mt = el('div', 'mt', '选择系统（不同系统的页面相互独立）');
    menu.appendChild(mt);
    liveSystems().forEach(function(s){
      var mi = el('button', 'mi' + (s.id === curSystemId ? ' on' : ''));
      mi.appendChild(el('span', null, (s.id === curSystemId ? '● ' : '○ ') + s.name));
      if (liveSystems().length > 1){
        var del = el('button', 'del', '删除');
        del.title = '删除该系统（其中页面会一并隐藏）';
        del.addEventListener('click', function(ev){
          ev.stopPropagation();
          closeSysMenu();
          askConfirm('删除系统「' + s.name + '」？该系统下的所有页面、排期与备注都会被隐藏（数据仍保留在备份中）。', '删除系统', function(){
            s.deleted = true; s.updatedAt = Date.now();
            scheduleSave();
            if (curSystemId === s.id){
              var first = liveSystems()[0];
              switchSystem(first ? first.id : 'sys_main');
            } else { renderTabs(); renderMain(); }
            toast('已删除系统');
          });
        });
        mi.appendChild(del);
      }
      mi.addEventListener('click', function(){
        closeSysMenu();
        if (s.id !== curSystemId) switchSystem(s.id);
      });
      menu.appendChild(mi);
    });
    var neu = el('button', 'mi mnew', '＋ 新建系统');
    neu.addEventListener('click', function(){
      closeSysMenu();
      askInput('新建系统', '输入系统名称，如：诺惠集团会员管理系统', '', '创建', function(v){
        if (!v){ toast('已取消'); return; }
        var ns = { id: uid('sys'), name: v, createdAt: Date.now(), updatedAt: Date.now(), deleted: false };
        S.systems.push(ns);
        // 给新系统建一个起始页面
        var nb = ensure({ id: uid('board'), name: '排期总览', columns: 2, systemId: ns.id,
          stripStart: '', createdAt: Date.now(), updatedAt: Date.now(), deleted:false,
          cards: [], notes: [], dateColors: {} });
        S.boards.push(nb);
        scheduleSave();
        switchSystem(ns.id);
        toast('已创建系统「' + v + '」，可开始搭建内容');
      });
    });
    menu.appendChild(neu);
    document.body.appendChild(menu);
    var r = this.getBoundingClientRect();
    var mw = menu.offsetWidth, mh = menu.offsetHeight;
    var left = Math.min(r.left, window.innerWidth - mw - 8);
    var top = r.bottom + 6;
    if (top + mh > window.innerHeight - 8) top = Math.max(8, r.top - mh - 6);
    menu.style.left = left + 'px';
    menu.style.top = top + 'px';
    setTimeout(function(){
      document.addEventListener('pointerdown', sysDocDown, true);
      document.addEventListener('keydown', sysEsc, true);
    }, 0);
  });

  /* ---------- 问题收集：记录问题 + 标签 + 解决方案 ---------- */
  function liveIssues(){
    return (S.issues || []).filter(function(n){ return n && !n.deleted; })
      .sort(function(x, y){ return (y.createdAt||0) - (x.createdAt||0); });
  }
  function findIssue(id){
    var l = S.issues || [];
    for (var i=0;i<l.length;i++) if (l[i].id === id && !l[i].deleted) return l[i];
    return null;
  }
  function tagClass(t){ return t === 'open' ? 'open' : t === 'doing' ? 'doing' : 'solved'; }

  function openIssuesDialog(filterTag){
    var mask = el('div', 'mask');
    var box = el('div', 'mbox issuesbox');
    var head = el('div', null);
    head.style.cssText = 'display:flex;justify-content:space-between;align-items:center;';
    var hb = el('div');
    hb.appendChild(el('b', null, '问题收集'));
    var sub = el('span', null, '记录设计与协作中的问题，跟踪解决进度');
    sub.style.cssText = 'display:block;font-size:11px;color:var(--faint);margin-top:3px;';
    hb.appendChild(sub);
    head.appendChild(hb);
    var x = el('button', 'dclose', '×');
    x.addEventListener('click', close);
    head.appendChild(x);
    box.appendChild(head);

    var body = el('div', 'ibody');

    function render(){
      body.innerHTML = '';
      var list = liveIssues();
      var filters = el('div', 'ifilt');
      filters.appendChild(el('span', null, '筛选：'));
      [{id:'all', name:'全部'}, {id:'open',name:'未解决'}, {id:'doing',name:'解决中'}, {id:'solved',name:'已解决'}].forEach(function(t){
        var cur = filterTag || 'all';
        var bt = el('button', 'tag' + (t.id !== 'all' ? ' ' + t.id : '') + (cur === t.id ? ' on' : ''), t.name + (t.id === 'all' ? '（' + list.length + '）' : '（' + list.filter(function(i){ return (i.tag||'open') === t.id; }).length + '）'));
        bt.addEventListener('click', function(){ filterTag = t.id; render(); });
        filters.appendChild(bt);
      });
      var addBtn = el('button', 'ghost', '＋ 新问题');
      addBtn.style.marginLeft = 'auto';
      addBtn.addEventListener('click', function(){
        var it = { id: uid('issue'), title: '', text: '', tag: 'open', solutions: [],
                   createdAt: Date.now(), updatedAt: Date.now(), deleted: false };
        S.issues.push(it);
        scheduleSave();
        filterTag = 'all';
        render();
        setTimeout(function(){
          var inputs = body.querySelectorAll('.issue input');
          if (inputs.length) inputs[0].focus();
        }, 30);
      });
      filters.appendChild(addBtn);
      body.appendChild(filters);

      var shown = filterTag && filterTag !== 'all'
        ? list.filter(function(i){ return (i.tag || 'open') === filterTag; }) : list;
      if (!shown.length){
        var e = el('div', 'notes-empty', '还没有问题记录。点「＋ 新问题」开始登记，如：多渠道素材版本混乱、达人物料改稿超时…');
        e.style.gridColumn = 'auto';
        body.appendChild(e);
        return;
      }
      shown.forEach(function(n){ body.appendChild(issueCard(n, render)); });
    }

    function issueCard(n, rerender){
      function live(){
        var x = findIssue(n.id);
        if (x) n = x;
        return n;
      }
      var card = el('div', 'issue');

      var top = el('div', 'itop');
      var ti = document.createElement('input');
      ti.value = n.title || '';
      ti.placeholder = '问题标题，如：多渠道素材版本混乱';
      ti.addEventListener('input', function(){ live(); n.title = ti.value; n.updatedAt = Date.now(); scheduleSave(); });
      top.appendChild(ti);

      var tags = el('div', 'tags');
      ISSUE_TAGS.forEach(function(t){
        var bt = el('button', tagClass(t.id) + ((n.tag || 'open') === t.id ? ' on' : ''), t.name);
        bt.addEventListener('click', function(){
          live(); n.tag = t.id; n.updatedAt = Date.now();
          scheduleSave(); rerender();
        });
        tags.appendChild(bt);
      });
      top.appendChild(tags);
      card.appendChild(top);

      var ta = document.createElement('textarea');
      ta.value = n.text || '';
      ta.placeholder = '问题描述 / 复现背景 / 影响范围…（自动保存）';
      ta.addEventListener('input', function(){ live(); n.text = ta.value; n.updatedAt = Date.now(); scheduleSave(); });
      card.appendChild(ta);

      var sols = el('div', 'sols');
      sols.appendChild(el('div', 'solhead', '解决方案（' + (n.solutions || []).length + '）'));
      (n.solutions || []).forEach(function(sp){
        var sol = el('div', 'sol');
        var sta = document.createElement('textarea');
        sta.value = sp.text || '';
        sta.placeholder = '解决方案内容…';
        sta.addEventListener('input', function(){
          var x = findIssue(n.id);
          if (!x) return;
          var s = null;
          (x.solutions || []).forEach(function(q){ if (q.id === sp.id) s = q; });
          if (!s) return;
          s.text = sta.value; s.updatedAt = Date.now(); x.updatedAt = Date.now();
          scheduleSave();
        });
        sol.appendChild(sta);
        var sfoot = el('div', 'sfoot');
        sfoot.appendChild(el('span', 'etime', fmtStamp(sp.updatedAt)));
        var sdel = el('button', 'edel', '删除方案');
        sdel.addEventListener('click', function(){
          askConfirm('删除这条解决方案？', '删除方案', function(){
            var x = findIssue(n.id);
            if (!x) return;
            x.solutions = (x.solutions || []).filter(function(q){ return q.id !== sp.id; });
            x.updatedAt = Date.now();
            scheduleSave(); rerender();
            toast('已删除方案');
          });
        });
        sfoot.appendChild(sdel);
        sol.appendChild(sfoot);
        sols.appendChild(sol);
      });
      var addSol = el('button', 'addsol', '＋ 添加解决方案');
      addSol.addEventListener('click', function(){
        var x = findIssue(n.id);
        if (!x){ toast('这条问题已被删除'); return; }
        x.solutions = (x.solutions || []).concat([{ id: uid('sol'), text: '', createdAt: Date.now(), updatedAt: Date.now() }]);
        x.updatedAt = Date.now();
        scheduleSave(); rerender();
        setTimeout(function(){
          var tas = body.querySelectorAll('.issue .sol textarea');
          if (tas.length){ tas[tas.length-1].focus(); }
        }, 30);
      });
      sols.appendChild(addSol);
      card.appendChild(sols);

      var foot = el('div', 'ifoot');
      foot.appendChild(el('span', 'etime', '登记于 ' + fmtStamp(n.createdAt)));
      var acts = el('div', 'fright');
      var sub = el('button', 'esubmit', '提交');
      sub.addEventListener('click', function(){
        var t = live();
        if (!(t.title && t.title.trim())){ toast('先给问题写个标题'); return; }
        sub.classList.add('done'); sub.textContent = '提交中…';
        t.updatedAt = Date.now();
        pushNow().then(function(ok){
          if (ok === false){ sub.classList.remove('done'); sub.textContent = '提交'; toast('提交失败，请重试'); return; }
          sub.textContent = '已提交';
          toast('提交成功');
          setTimeout(function(){ sub.classList.remove('done'); sub.textContent = '提交'; }, 1600);
        });
      });
      acts.appendChild(sub);
      var del = el('button', 'edel', '删除问题');
      del.addEventListener('click', function(){
        askConfirm('删除问题「' + (n.title || '未命名') + '」？其下的解决方案会一并删除。', '删除问题', function(){
          var x = findIssue(n.id) || n;
          x.deleted = true; x.updatedAt = Date.now();
          scheduleSave(); rerender();
          toast('已删除问题');
        });
      });
      acts.appendChild(del);
      foot.appendChild(acts);
      card.appendChild(foot);
      return card;
    }

    render();
    box.appendChild(body);
    mask.appendChild(box);
    mask.addEventListener('click', function(e){ if (e.target === mask) close(); });
    document.addEventListener('keydown', onKey, true);
    document.body.appendChild(mask);
    function close(){
      if (mask.parentNode) mask.parentNode.removeChild(mask);
      document.removeEventListener('keydown', onKey, true);
    }
    function onKey(e){ if (e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); close(); } }
  }
  document.getElementById('issuesBtn').addEventListener('click', function(){ openIssuesDialog('all'); });

  /* ---------- 分享弹窗：微信 / 企业微信 / 复制链接 ---------- */
  function openShareDialog(){
    var url = location.href.split('#')[0];
    var mask = el('div', 'mask');
    var box = el('div', 'mbox sharebox');
    box.appendChild(el('b', null, '分享排期台'));
    box.appendChild(el('p', null, '把这条链接发给同事，打开即可一起查看和编辑（多人同时改动会自动合并）。'));

    var linkrow = el('div', 'share-link');

    inp.value = url; inp.readOnly = true;
    inp.addEventListener('focus', function(){ try { inp.select(); } catch(e){} });
    linkrow.appendChild(inp);
    var cp = el('button', 'ghost', '复制');
    cp.addEventListener('click', function(){ copyText(url, '链接已复制到剪贴板'); });
    linkrow.appendChild(cp);
    box.appendChild(linkrow);

    var grid = el('div', 'share-grid');
    function channelBtn(label, scheme, tip){
      var bt = el('button', 'ghost');
      bt.appendChild(el('span', null, label));
      bt.appendChild(el('small', null, tip));
      bt.addEventListener('click', function(){
        copyText(url, '链接已复制，打开' + label + '后粘贴发送即可');
        if (scheme){
          toast('正在打开' + label + '…');

      });

    }
    grid.appendChild(channelBtn('微信', 'weixin://', '复制链接并打开微信'));
