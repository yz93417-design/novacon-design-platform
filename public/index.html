    box.appendChild(grid);

    box.appendChild(el('div', 'share-note', '说明：点击微信 / 企业微信会先复制链接、再尝试唤起对应应用；若未自动打开（或未安装），请手动粘贴链接发送。网页版微信不支持直接带链接唤起，用「复制」后粘贴同样一步到位。'));

    var foot = el('div', 'mfoot');
    var done = el('button', 'done', '完成');
    foot.appendChild(done);
    box.appendChild(foot);

    function close(){
      if (mask.parentNode) mask.parentNode.removeChild(mask);
      document.removeEventListener('keydown', onKey, true);
    }
    function onKey(e){ if (e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); close(); } }
    done.addEventListener('click', close);
    mask.addEventListener('click', function(e){ if (e.target === mask) close(); });
    document.addEventListener('keydown', onKey, true);
    mask.appendChild(box);
    document.body.appendChild(mask);
    setTimeout(function(){ try { inp.focus(); inp.select(); } catch(e){} }, 50);
  }
  document.getElementById('shareBtn').addEventListener('click', openShareDialog);

  /* ---------- 主区 ---------- */
  function renderMain(){
    $main.innerHTML = '';
    if (view === 'gallery'){ renderGallery(); return; }   // 相册是全局的，不依赖具体页面
    var b = board();
    if (!b){
      var e = el('div', 'empty');
      e.appendChild(el('div', null, '还没有页面。'));
      var btn = el('button', 'ghost', '新建一个页面');
      btn.addEventListener('click', function(){ document.querySelector('.tab-add').click(); });
      e.appendChild(btn);
      $main.appendChild(e);
      return;
    }
    if (view === 'strip') renderStrip(b); else if (view === 'timeline') renderTimeline(b); else { renderStats(); return; }
  }

  /* ---------- 横向日期条 ---------- */
  function selCount(){ return Object.keys(sel.set).length; }

  function renderStrip(b){
    var start = stripStartOf(b);
    var DAYS = 45;
    var end = addDays(start, DAYS - 1);
    function md(d){ return (d.getMonth()+1) + '月' + d.getDate() + '日'; }

    var head = el('div', 'view-head');
    var left = el('div', 'vtitle');
    left.appendChild(document.createTextNode('横向排期'));
    left.appendChild(el('small', null, md(start) + ' — ' + md(end) + ' · 共 ' + cardsOf(b).length + ' 条'));
    head.appendChild(left);

    var nav = el('div', 'nav');
    var prev = el('button', null, '‹'); prev.title = '前一周';
    prev.addEventListener('click', function(){ shiftStrip(b, -7); });
    var next = el('button', null, '›'); next.title = '后一周';
    next.addEventListener('click', function(){ shiftStrip(b, 7); });
    var todayBtn = el('button', 'wide', '回到本周');
    todayBtn.addEventListener('click', function(){
      b.stripStart = ymd(addDays(new Date(), -3));
      touchBoard(b); renderMain();
    });
    nav.appendChild(prev); nav.appendChild(next); nav.appendChild(todayBtn);
    head.appendChild(nav);
    $main.appendChild(head);

    if (selCount()) $main.appendChild(selBar(b));

    var shell = el('div', 'strip-shell');
    var strip = el('div', 'strip');
    var today = todayStr();

    for (var i=0;i<DAYS;i++){
      let d = addDays(start, i);
      let ds = ymd(d);
      let col = el('div', 'daycol' + (d.getDay()===0||d.getDay()===6 ? ' wk' : '') + (ds===today ? ' today' : '') + (sel.set[ds] ? ' sel' : ''));
      col.setAttribute('data-date', ds);

      let dh = el('div', 'dhead');
      let tc = colorOfDate(b, ds);
      if (tc){
        let th = hexOf(tc);
        let isBai = (normColor(tc) === 'white');
        dh.style.background = isBai ? 'rgba(242,234,225,.10)' : tint(th, 0.16);
        dh.style.borderTop = '3px solid ' + (isBai ? '#F2EAE1' : th);
        dh.style.paddingTop = '5px';
      }
      dh.appendChild(el('span', 'dnum', (d.getMonth()+1) + '/' + d.getDate()));
      dh.appendChild(el('span', 'dwd', ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()]));
      dh.title = '按住拖动可连续多选 · 双击打开这一天';

      let more = el('button', 'dmore', '⋯');
      more.title = '更多：标色 / 编辑 / 清空';
      more.addEventListener('pointerdown', function(ev){ ev.stopPropagation(); });
      more.addEventListener('click', function(ev){
        ev.stopPropagation(); ev.preventDefault();
        openDayMenu(b, ds, more);
      });
      dh.appendChild(more);

      (function(dayStr){
        dh.addEventListener('pointerdown', function(ev){
          if (ev.button !== 0) return;
          selecting = true; lastSelAt = Date.now();
          if (ev.shiftKey && sel.anchor){
            var keep = sel.anchor;
            sel.set = {}; sel.anchor = keep;
            selectRange(dayStr);
          } else {
            sel.anchor = dayStr; sel.set = {}; sel.set[dayStr] = true;
          }
          paintSelection(); syncSelBar(b);
          ev.preventDefault();
        });
        dh.addEventListener('pointerenter', function(){
          if (!selecting || !sel.anchor) return;
          lastSelAt = Date.now();
          var keep = sel.anchor;
          sel.set = {}; sel.anchor = keep;
          selectRange(dayStr);
          paintSelection(); syncSelBar(b);
        });
        dh.addEventListener('dblclick', function(){ openDay(dayStr); });
      })(ds);
      col.appendChild(dh);

      let box2 = el('div', 'dcards');
      let list = cardsOf(b, ds);
      list.forEach(function(c){
        var hasImg = !!(c.images && c.images.length);
        var mini = el('div', 'mcard' + (hasImg ? ' hasimg' : ''));
        mini.setAttribute('data-cid', c.id);
        mini.style.borderLeftColor = hexOf(c.color);
        if (hasImg){
          var im = el('img'); im.src = c.images[0]; im.loading = 'lazy';
          mini.appendChild(im);
        }
        var mt = el('div', 'mtxt');
        mt.appendChild(el('b', null, c.title || '未命名'));
        if (hasImg && c.images.length > 1) mt.appendChild(el('em', null, '＋' + (c.images.length-1) + ' 图'));
        else if (c.text) mt.appendChild(el('span', null, c.text));
        mini.appendChild(mt);

        // 每条任务可单独编辑 / 删除
        var mact = el('div', 'mact');
        var eb = el('button', null, '✎');
        eb.title = '编辑这一条';
        eb.addEventListener('click', function(ev){ ev.stopPropagation(); openDay(ds); setTimeout(function(){ focusCard(c.id); }, 260); });
        var db = el('button', null, '×');
        db.title = '删除这一条';
        db.addEventListener('click', function(ev){ ev.stopPropagation(); deleteCard(c.id, c.title); });
        mact.appendChild(eb); mact.appendChild(db);
        mini.appendChild(mact);

        mini.addEventListener('click', function(ev){ ev.stopPropagation(); openDay(ds); });
        box2.appendChild(mini);
      });
      col.appendChild(box2);

      // 底部：加排期 + 备注入口（每天可挂多条备注）
      var dfoot = el('div', 'dfoot');
      var add = el('button', 'miniadd', '＋');
      add.title = '给这一天添加排期';
      (function(dayStr){ add.addEventListener('click', function(ev){ ev.stopPropagation(); openDay(dayStr, true); }); })(ds);
      dfoot.appendChild(add);

      var dnotes = notesOn(b, ds);
      var nbtn = el('button', 'notebtn' + (dnotes.length ? ' has' : ''));
      nbtn.title = dnotes.length ? ('这一天有 ' + dnotes.length + ' 条备注') : '给这一天添加备注';
      nbtn.appendChild(el('span', null, '✎'));
      if (dnotes.length){
        var dots = el('div', 'ndots');
        dnotes.slice(0, 5).forEach(function(n){
          var dt = el('div', 'ndot'); dt.style.background = hexOf(n.color || 'gold'); dots.appendChild(dt);
        });
        nbtn.appendChild(dots);
        if (dnotes.length > 1) nbtn.appendChild(el('span', null, String(dnotes.length)));
      }
      (function(dayStr){ nbtn.addEventListener('click', function(ev){ ev.stopPropagation(); openNotes(dayStr); }); })(ds);
      dfoot.appendChild(nbtn);
      col.appendChild(dfoot);

      (function(dayStr){
        col.addEventListener('click', function(ev){
          if (dragMoved || selecting) return;
          if (Date.now() - lastSelAt < 260) return;
          if (ev.target.closest('.mcard') || ev.target.closest('button') || ev.target.closest('.dhead')) return;
          openDay(dayStr);
        });
        // 双击单元格任意位置进入编辑
        col.addEventListener('dblclick', function(ev){
          if (dragMoved) return;
          if (ev.target.closest('button')) return;
          openDay(dayStr);
        });
      })(ds);

      // 把图片直接拖到某一天：自动建一条带图的排期
      (function(dayStr, colEl){
        colEl.addEventListener('dragover', function(ev){ ev.preventDefault(); colEl.classList.add('dropon'); });
        colEl.addEventListener('dragleave', function(){ colEl.classList.remove('dropon'); });
        colEl.addEventListener('drop', function(ev){
          ev.preventDefault(); ev.stopPropagation();
          colEl.classList.remove('dropon');
          var fs = Array.prototype.slice.call((ev.dataTransfer && ev.dataTransfer.files) || [])
            .filter(function(f){ return /^image\//.test(f.type); });
          if (!fs.length) return;
          var nb = board(); if (!nb) return;
          var nc = { id: uid('card'), date: dayStr, title:'', text:'', color:'red', images:[], order: cardsOf(nb, dayStr).length, updatedAt: Date.now(), deleted:false };
          nb.cards.push(nc);
          active.board = nb; active.card = nc;
          drawerDate = dayStr;
          $drawer.classList.add('open');
          attachImages(nb, nc, fs);
        });
      })(ds, col);

      strip.appendChild(col);
    }

    bindStripDrag(strip);
    shell.appendChild(strip);
    $main.appendChild(shell);

    var tip = el('div', 'striptip');
    tip.textContent = '按住日期头左右拖动可连续多选 → 上方标色 · 点空白处拖动可平移时间 · 双击日期加排期 · 格下 ✎ 加备注';
    $main.appendChild(tip);

    setTimeout(function(){
      var todayCol = strip.querySelector('.daycol.today');
      strip.scrollLeft = todayCol ? Math.max(0, todayCol.offsetLeft - strip.clientWidth / 2 + 76) : 0;
    }, 0);
  }

  function shiftStrip(b, delta){
    b.stripStart = ymd(addDays(stripStartOf(b), delta));
    touchBoard(b);
    renderMain();
  }

  function bindStripDrag(sc){
    var down = false, startX = 0, startL = 0;
    sc.addEventListener('pointerdown', function(e){
      if (e.button !== 0) return;
      if (e.target.closest('.dhead') || e.target.closest('button') || e.target.closest('.mcard')) return;
      down = true; dragMoved = false; startX = e.clientX; startL = sc.scrollLeft;
      sc.classList.add('dragging');
    });
    sc.addEventListener('pointermove', function(e){
      if (!down) return;
      var dx = e.clientX - startX;
      if (Math.abs(dx) > 5) dragMoved = true;
      sc.scrollLeft = startL - dx;
    });
    function up(){
      if (!down) return;
      down = false;
      sc.classList.remove('dragging');
      setTimeout(function(){ dragMoved = false; }, 30);
    }
    sc.addEventListener('pointerup', up);
    sc.addEventListener('pointercancel', up);
    sc.addEventListener('pointerleave', up);
    sc.addEventListener('wheel', function(e){
      if (Math.abs(e.deltaY) > Math.abs(e.deltaX)){
        sc.scrollLeft += e.deltaY;
        e.preventDefault();
      }
    }, {passive:false});
  }

  function selectRange(to){
    var a = sel.anchor, b = to;
    if (a > b){ var t = a; a = b; b = t; }
    var d = parseYmd(a), end = parseYmd(b), guard = 0;
    while (d <= end && guard < 400){
      sel.set[ymd(d)] = true;
      d = addDays(d, 1); guard++;
    }
  }

  function applyColor(b, colorId){

  /* ---------- 备注 / 文本框 ---------- */
  function renderNotes(b){

  function noteCard(b, n, opts){
    opts = opts || {};
    var box = el('div', 'note');
    box.style.borderLeftColor = hexOf(n.color || 'gold');

    function live(){
      b = liveBoard(b);
      var x = findNote(b, n.id);
      if (x) n = x;
      return n;
    }

    var top = el('div', 'ntop');
    if (opts.showDate !== false){
      var chip = el('button', 'dchip', n.date ? ('📅 ' + n.date.slice(5).replace('-', '/')) : '📅 未挂日期');
      chip.title = n.date ? '打开这一天的备注' : '尚未挂到具体日期';
      if (n.date) chip.addEventListener('click', function(){ openNotes(n.date); });
      top.appendChild(chip);
    } else {
      top.appendChild(el('span', 'etime', ''));
    }

    var sws = el('div', 'sws');
    COLORS.forEach(function(c){
      var s = el('button', 'sw' + (normColor(n.color) === c.id ? ' on' : ''));
      s.style.background = c.hex; s.title = c.name;
      s.addEventListener('click', function(){
        live();
        n.color = c.id; n.updatedAt = Date.now();
        box.style.borderLeftColor = c.hex;
        var all = sws.querySelectorAll('.sw');
        for (var i=0;i<all.length;i++) all[i].classList.remove('on');
        s.classList.add('on');
        touchBoard(b); renderMain();
      });
      sws.appendChild(s);
    });
    top.appendChild(sws);
    box.appendChild(top);

    var title = el('input');
    title.type = 'text';
    title.value = n.title || '';
    title.placeholder = '备注标题，如：素材交付规则';
    title.addEventListener('input', function(){ live(); n.title = title.value; n.updatedAt = Date.now(); touchBoard(b); });
    box.appendChild(title);

    var ta = el('textarea');
    ta.value = n.text || '';
    ta.placeholder = '写点什么…（自动保存，也可点「提交」立即同步）';
    function autosize(){ ta.style.height = 'auto'; ta.style.height = Math.max(66, ta.scrollHeight) + 'px'; }
    ta.addEventListener('input', function(){ live(); n.text = ta.value; n.updatedAt = Date.now(); touchBoard(b); autosize(); });
    box.appendChild(ta);
    setTimeout(autosize, 0);

    var foot = el('div', 'nfoot');
    foot.appendChild(el('span', 'etime', fmtStamp(n.updatedAt)));

    var acts = el('div', 'fright');
    var sub = el('button', 'esubmit', '提交');
    sub.title = '立即保存';
    sub.addEventListener('click', function(){
      var t = live();
      if (!(t.title && t.title.trim()) && !(t.text && t.text.trim())){ toast('先写点内容再提交'); return; }
      sub.classList.add('done'); sub.textContent = '提交中…';
      t.updatedAt = Date.now();
      b.updatedAt = Date.now();
      pushNow().then(function(ok){
        if (ok === false){ sub.classList.remove('done'); sub.textContent = '提交'; toast('提交失败，请重试'); return; }
        sub.textContent = '已提交';
        toast('提交成功');
        setTimeout(function(){ sub.classList.remove('done'); sub.textContent = '提交'; }, 1600);
      });
    });
    acts.appendChild(sub);

    var del = el('button', 'edel', '删除');
    del.addEventListener('click', function(){
      var t = live();
      askConfirm('删除这条备注？', '删除备注', function(){
        var target = findNote(b, t.id) || t;
        target.deleted = true; target.updatedAt = Date.now();
        touchBoard(b); renderMain();
        if ($drawer.classList.contains('open') && drawerMode === 'notes') renderDrawer();
      });
    });
    acts.appendChild(del);
    foot.appendChild(acts);
    box.appendChild(foot);
    return box;
  }

  function addNote(b, date){
    var n = {
      id: uid('note'), date: date || todayStr(), title:'', text:'', color:'gold',
      createdAt: Date.now(), updatedAt: Date.now(), deleted:false
    };
    b.notes.push(n);
    b.updatedAt = Date.now();
    scheduleSave();

    if ($drawer.classList.contains('open') && drawerMode === 'notes' && drawerDate === n.date){
      renderDrawer();
      renderMain();
      setTimeout(function(){
        var inputs = $drawer.querySelectorAll('.note input');
        if (inputs.length) inputs[inputs.length-1].focus();
      }, 40);
    } else {
      renderMain();
      setTimeout(function(){
        var cards = $main.querySelectorAll('.note');
        var inputs = cards.length ? cards[cards.length-1].querySelectorAll('input') : [];
        if (inputs.length) inputs[inputs.length-1].focus();
      }, 40);
    }
  }

            var b2 = el('button', null, '✎'); b2.title = '编辑这张图';
            b2.addEventListener('click', function(ev){ ev.stopPropagation(); openImageEditor(b, c.id, idx); });
            var b3 = el('button', null, '↗'); b3.title = '分享这张图';

            act.appendChild(b1); act.appendChild(b2); act.appendChild(b3);

          });

          if (n > 2){

            tog.title = expanded ? '只展示前 2 张' : '展开全部 ' + n + ' 张图片';
            tog.addEventListener('click', function(ev){ ev.stopPropagation(); tlExpand[c.id] = !expanded; renderMain(); });
            bar.appendChild(tog);
          }
          var a1 = el('button', null, '全部下载');
          a1.addEventListener('click', function(ev){ ev.stopPropagation(); downloadAll(b, c.id); });
          var a2 = el('button', null, '分享素材');
          a2.addEventListener('click', function(ev){ ev.stopPropagation(); shareCard(b, c.id); });
          bar.appendChild(a1); bar.appendChild(a2);
          card.appendChild(bar);
        }
        card.appendChild(el('h4', null, c.title || '未命名'));
        if (c.text) card.appendChild(el('p', null, c.text));
        card.addEventListener('click', function(){ openDay(ds); });
        wrap.appendChild(card);
      });

      row.appendChild(wrap);
      tl.appendChild(row);
    });
    $main.appendChild(tl);

  /* ---------- 抽屉 ---------- */
  function openDay(ds, focusNew){
    drawerMode = 'cards';
    drawerDate = ds;
    $drawer.classList.add('open');
    renderDrawer();
    if (focusNew){
      var b = board();
      if (b) addCard(b, ds, true);
    }
  }
  function openNotes(ds){
    drawerMode = 'notes';
    drawerDate = ds;
    $drawer.classList.add('open');
    renderDrawer();
  }
  function closeDrawer(){
    drawerDate = null;
    $drawer.classList.remove('open');
  }

  function renderDrawer(){
    if (!drawerDate) return;
    if (drawerMode === 'notes') return renderNoteDrawer();
    var b = board();
    $drawer.innerHTML = '';
    var d = parseYmd(drawerDate);

    var head = el('div', 'dhead');
    var left = el('div');
    left.appendChild(el('b', null, (d.getMonth()+1) + ' 月 ' + d.getDate() + ' 日'));
    var wd = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
    var cc = b ? colorOfDate(b, drawerDate) : null;
    left.appendChild(el('span', null, wd + (cc ? ' · 已标色' : '') + ' · 可直接编辑，自动保存'));
    head.appendChild(left);
    var close = el('button', 'dclose', '×');
    close.addEventListener('click', closeDrawer);
    head.appendChild(close);
    $drawer.appendChild(head);

    var body = el('div', 'dbody');
    var list = b ? cardsOf(b, drawerDate) : [];

    if (!list.length){
      var e = el('div', 'empty');
      e.style.padding = '30px 0';
      e.appendChild(el('div', null, '这一天还没有内容'));
      body.appendChild(e);
    }

    // 多条任务时，先给一份清单：每条都能单独编辑 / 删除
    if (list.length > 1){
      var tl = el('div', 'tasklist');
      tl.appendChild(el('div', 'tlabel', '这一天共 ' + list.length + ' 条任务 · 可单独编辑或删除'));
      list.forEach(function(c){
        var row = el('div', 'trow');
        var dot = el('span', 'tdot'); dot.style.background = hexOf(c.color);
        row.appendChild(dot);
        row.appendChild(el('span', 'tname', c.title || '未命名'));
        var n = (c.images || []).length;
        if (n) row.appendChild(el('span', 'tmeta', n + ' 图'));
        var eb = el('button', 'tsm', '编辑');
        eb.addEventListener('click', function(){ focusCard(c.id); });
        var db = el('button', 'tsm del', '删除');
        db.addEventListener('click', function(){ deleteCard(c.id, c.title); });
        row.appendChild(eb); row.appendChild(db);
        tl.appendChild(row);
      });
      body.appendChild(tl);
    }

    list.forEach(function(c){ body.appendChild(cardEditor(b, c)); });

    var add = el('button', 'dadd', '＋ 添加一条');
    add.addEventListener('click', function(){ addCard(b, drawerDate, true); });
    body.appendChild(add);

    body.appendChild(el('div', 'dhint', '提示：同一页面可多人同时编辑，改动自动保存并同步；鼠标移到图片上可【下载】【编辑】【分享】【删除】，卡片下方可【全部下载】。'));
    $drawer.appendChild(body);

  function cardEditor(b, c){
    var box = el('div', 'ecard');
    box.setAttribute('data-cid', c.id);

    /* 服务端同步后 S.boards 会被整体替换，闭包里的 c 可能已失效。
       每次操作前按 id 重新取当前对象，保证改动落在“活着”的那份数据上。 */
    function live(){
      b = liveBoard(b);
      var x = findCard(b, c.id);
      if (x) c = x;
      return c;
    }

    var colors = el('div', 'colors');
    COLORS.forEach(function(col){
      var sw = el('button', 'sw' + (normColor(c.color) === col.id ? ' on' : ''));
      sw.style.background = col.hex;
      sw.title = col.name;
      sw.addEventListener('click', function(){
        live();
        c.color = col.id; c.updatedAt = Date.now(); touchBoard(b);
        renderDrawer(); renderMain();
      });
      colors.appendChild(sw);
    });
    box.appendChild(colors);

    // 渠道 / 设计师 / 活动 / 图类型：用于「数据统计」视图的汇总
    var meta = el('div', 'meta-row');
    function buildChSel(c){
      var sel = document.createElement('select');
      [''].concat(channelNames()).forEach(function(ch){
        var o = document.createElement('option');
        o.value = ch;
        o.textContent = ch || '渠道：未指定';
        if ((c.channel || '') === ch) o.selected = true;
        sel.appendChild(o);
      });
      sel.addEventListener('change', function(){
        live(); c.channel = sel.value; c.updatedAt = Date.now(); touchBoard(b);
      });
      return sel;
    }
    meta.appendChild(buildChSel(c));

    function buildDesignerSel(c){
      var sel = document.createElement('select');
      var opts = [''].concat(designerNames()).concat(['__add']);
      opts.forEach(function(nm){
        var o = document.createElement('option');
        o.value = nm;
        o.textContent = nm === '' ? '设计师：未指定' : (nm === '__add' ? '＋ 添加人员…' : nm);
        if (nm !== '__add' && (c.designer || '') === nm) o.selected = true;
        sel.appendChild(o);
      });
      sel.addEventListener('change', function(){
        if (sel.value === '__add'){
          sel.value = c.designer || '';
          askInput('添加设计师', '输入设计师姓名 / 昵称', '', '添加', function(v){
            if (!v){ toast('已取消'); return; }
            var names = designerNames();
            if (names.indexOf(v) < 0){
              S.designers = (S.designers || []).concat([{ id: uid('dsn'), name: v, createdAt: Date.now(), updatedAt: Date.now(), deleted: false }]);
              scheduleSave();
            }
            var t = live();
            t.designer = v; t.updatedAt = Date.now(); touchBoard(b);
            renderDrawer();
            toast('已添加设计师「' + v + '」，全端可用');
          });
          return;
        }
        live(); c.designer = sel.value; c.updatedAt = Date.now(); touchBoard(b);
      });
      return sel;
    }
    meta.appendChild(buildDesignerSel(c));

    /* 对接人：与设计师分开维护，可在下拉里现场添加 */
    function buildContactSel(c){
      var sel = document.createElement('select');
      var opts = [''].concat(contactNames()).concat(['__add']);
      opts.forEach(function(nm){
        var o = document.createElement('option');
        o.value = nm;
        o.textContent = nm === '' ? '对接人：未指定' : (nm === '__add' ? '＋ 添加对接人…' : nm);
        if (nm !== '__add' && (c.contact || '') === nm) o.selected = true;
        sel.appendChild(o);
      });
      sel.addEventListener('change', function(){
        if (sel.value === '__add'){
          sel.value = c.contact || '';
          askInput('添加对接人', '输入对接人姓名 / 昵称', '', '添加', function(v){
            if (!v){ toast('已取消'); return; }
            var names = contactNames();
            if (names.indexOf(v) < 0){
              S.contacts = (S.contacts || []).concat([{ id: uid('ct'), name: v, createdAt: Date.now(), updatedAt: Date.now(), deleted: false }]);
              scheduleSave();
            }
            var t = live();
            t.contact = v; t.updatedAt = Date.now(); touchBoard(b);
            renderDrawer();
            toast('已添加对接人「' + v + '」，全端可用');
          });
          return;
        }
        live(); c.contact = sel.value; c.updatedAt = Date.now(); touchBoard(b);
      });
      return sel;
    }
    meta.appendChild(buildContactSel(c));

    var actIn = document.createElement('input');
    actIn.className = 'meta-act';
    actIn.placeholder = '活动名称，如：双11预售（用于数据统计）';
    actIn.value = c.activity || '';
    actIn.addEventListener('input', function(){
      live(); c.activity = actIn.value; c.updatedAt = Date.now(); touchBoard(b);
    });
    meta.appendChild(actIn);

    var roleSel = document.createElement('select');
    [['', '图片类型：未标记'], ['creative', '创意图'], ['extended', '延展图']].forEach(function(r){
      var o = document.createElement('option');
      o.value = r[0]; o.textContent = r[1];
      if ((c.imgRole || '') === r[0]) o.selected = true;
      roleSel.appendChild(o);
    });
    roleSel.addEventListener('change', function(){
      live(); c.imgRole = roleSel.value; c.updatedAt = Date.now(); touchBoard(b);
    });
    meta.appendChild(roleSel);
    box.appendChild(meta);

    var title = el('input', 'title');

  /* ---------- 图片：粘贴 / 拖拽 / 上传 ---------- */
  function imageFilesFrom(data){
    var out = [];
    if (!data) return out;
    var items = data.items || [];
    for (var i=0;i<items.length;i++){
      if (items[i].kind === 'file'){
        var f = items[i].getAsFile();
        if (f && /^image\//.test(f.type)) out.push(f);
      }
    }
    if (!out.length && data.files){
      for (var j=0;j<data.files.length;j++){
        if (/^image\//.test(data.files[j].type)) out.push(data.files[j]);
      }
    }
    return out;
  }

  function attachImages(b, c, files){
    if (!b || !c) return;
    if (!files || !files.length){ toast('没有检测到图片'); return; }
    var cid = c.id;
    toast('正在处理 ' + files.length + ' 张图片…');
    Promise.all(files.map(function(f){ return compress(f); })).then(function(res){
      var ok = res.filter(function(x){ return !!x; });
      if (!ok.length){ toast('图片读取失败，请重试'); return; }
      // 压缩是异步的，期间看板可能已被同步替换：按 id 重新取当前对象再写入
      var bb = liveBoard(b);
      var target = findCard(bb, cid);
      if (!target){ toast('这条排期已被删除，图片未保存'); return; }
      target.images = (target.images || []).concat(ok);
      target.updatedAt = Date.now();
      bb.updatedAt = Date.now();
      touchBoard(bb);
      renderDrawer(); renderMain();
      toast('已添加 ' + ok.length + ' 张，当前共 ' + target.images.length + ' 张');
    });
  }

  function pasteTarget(){
    var b = board();
    if (!b) return null;
    if (active.card){
      var live = findCard(b, active.card.id);
      if (live) return { board: b, card: live };
    }
    active.card = null;
    if (!drawerDate) return null;
    var list = cardsOf(b, drawerDate);
    return list.length ? { board: b, card: list[list.length - 1] } : null;
  }

  /* ---------- 素材：下载 / 分享 / 编辑 / 删除 ---------- */
  function imgName(c, idx){
    var base = String((c && c.title) || '排期').replace(/[\\/:*?"<>|\s]+/g, '-').slice(0, 24) || '排期';
    var d = (c && c.date) ? c.date : '';
    return base + (d ? '-' + d : '') + '-' + (idx + 1) + '.jpg';
  }
  function downloadImage(src, name){
    if (!src) return;
    var a = document.createElement('a');
    a.href = src; a.download = name || 'image.jpg';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ if (a.parentNode) a.parentNode.removeChild(a); }, 100);
  }
  function downloadAll(b, cardId){
    var card = findCard(liveBoard(b), cardId);
    if (!card || !(card.images || []).length){ toast('这条还没有图片'); return; }
    card.images.forEach(function(src, i){
      setTimeout(function(){ downloadImage(src, imgName(card, i)); }, i * 420);
    });
    toast('正在下载 ' + card.images.length + ' 张图片');
  }
  function dataURLtoBlob(d){
    var parts = String(d).split(',');
    var mime = (parts[0].match(/:(.*?);/) || [])[1] || 'image/jpeg';
    var bin = atob(parts[1] || '');
    var arr = new Uint8Array(bin.length);
    for (var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], {type: mime});
  }
  function copyText(txt, okMsg){
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ toast(okMsg); }, function(){ window.prompt('复制这个链接分享：', txt); });
    } else {
      window.prompt('复制这个链接分享：', txt);
    }
  }
  function shareLinkFor(card, idx){
    var base = location.href.split('#')[0];
    var q = '#day=' + (card.date || '');
    if (typeof idx === 'number') q += '&img=' + idx;
    return base + q;
  }
  function shareImage(b, cardId, idx){
    var card = findCard(liveBoard(b), cardId);
    if (!card) return;
    var src = (card.images || [])[idx];
    if (!src) return;
    try {
      var f = new File([dataURLtoBlob(src)], imgName(card, idx), {type:'image/jpeg'});
      if (navigator.canShare && navigator.canShare({files:[f]})){
        navigator.share({files:[f], title: card.title || '设计素材'}).catch(function(){});
        return;
      }
    } catch(e){}
    copyText(shareLinkFor(card, idx), '已复制素材链接，发给同事可直接打开这张图');
  }
  function shareCard(b, cardId){
    var card = findCard(liveBoard(b), cardId);
    if (!card) return;
    var imgs = card.images || [];
    try {
      if (imgs.length && navigator.canShare){
        var files = imgs.map(function(src, i){ return new File([dataURLtoBlob(src)], imgName(card, i), {type:'image/jpeg'}); });
        if (navigator.canShare({files: files})){
          navigator.share({files: files, title: card.title || '设计素材'}).catch(function(){});
          return;
        }
      }
    } catch(e){}
    copyText(shareLinkFor(card), '已复制这条排期的链接，同事打开即可看到全部素材');
  }

  /* 图片编辑器：旋转 + 亮度 + 对比度，保存后覆盖原图 */
  function openImageEditor(b, cardId, idx){
    var card = findCard(liveBoard(b), cardId);
    if (!card) return;
    var src = (card.images || [])[idx];
    if (!src){ toast('图片不存在'); return; }

    var rot = 0, bright = 100, contrast = 100;
    var mask = el('div'); mask.id = 'imgedit';
    var box = el('div', 'ibox');

    var head = el('div', 'ihead');
    var hb = el('div');
    hb.appendChild(el('b', null, '编辑素材'));
    hb.appendChild(el('span', null, '第 ' + (idx + 1) + ' 张'));
    head.appendChild(hb);
    var x = el('button', null, '×'); x.title = '关闭';
    head.appendChild(x);
    box.appendChild(head);

    var stage = el('div', 'stage');
    var cv = document.createElement('canvas');
    stage.appendChild(cv);
    box.appendChild(stage);

    var img = new Image();
    function draw(){
      var w = img.naturalWidth || 1, h = img.naturalHeight || 1;
      var swap = (rot % 180) !== 0;
      var cw = swap ? h : w, ch = swap ? w : h;
      var s = Math.min(1, 1100 / Math.max(cw, ch));
      cv.width = Math.max(1, Math.round(cw * s));
      cv.height = Math.max(1, Math.round(ch * s));
      var g = cv.getContext('2d');
      g.clearRect(0, 0, cv.width, cv.height);
      g.save();
      g.translate(cv.width / 2, cv.height / 2);
      g.rotate(rot * Math.PI / 180);
      try { g.filter = 'brightness(' + (bright/100) + ') contrast(' + (contrast/100) + ')'; } catch(e){}
      g.drawImage(img, -w * s / 2, -h * s / 2, w * s, h * s);
      g.restore();
    }
    img.onload = draw;
    img.onerror = function(){ toast('图片读取失败'); };
    img.src = src;

    var rotRow = el('div', 'irot');
    var rl = el('button', null, '↺ 左转 90°');
    var rr = el('button', null, '↻ 右转 90°');
    rl.addEventListener('click', function(){ rot = (rot + 270) % 360; draw(); });
    rr.addEventListener('click', function(){ rot = (rot + 90) % 360; draw(); });
    rotRow.appendChild(rl); rotRow.appendChild(rr);
    box.appendChild(rotRow);

    function slider(labelText, key, min, max){
      var row = el('div', 'ctl');
      row.appendChild(el('span', null, labelText));
      var r = document.createElement('input');
      r.type = 'range'; r.min = min; r.max = max; r.step = 1;
      r.value = key === 'bright' ? bright : contrast;
      var v = el('span', 'val', r.value + '%');
      r.addEventListener('input', function(){
        if (key === 'bright') bright = +r.value; else contrast = +r.value;
        v.textContent = r.value + '%';
        draw();
      });
      row.appendChild(r); row.appendChild(v);
      return row;
    }
    box.appendChild(slider('亮度', 'bright', 40, 180));
    box.appendChild(slider('对比度', 'contrast', 40, 180));

    var foot = el('div', 'ifoot');
    var reset = el('button', 'reset', '重置');
    reset.addEventListener('click', function(){
      rot = 0; bright = 100; contrast = 100;
      box.querySelectorAll('input[type=range]').forEach(function(r, i){
        r.value = 100;
        var v = r.parentNode.querySelector('.val'); if (v) v.textContent = '100%';
      });
      draw();
    });
    foot.appendChild(reset);

    var right = el('div', 'r');
    var cancel = el('button', 'cancel', '取消');
    var save = el('button', 'save', '保存');
    cancel.addEventListener('click', close);
    save.addEventListener('click', function(){
      var out;
      try { out = cv.toDataURL('image/jpeg', 0.86); } catch(e){ toast('保存失败，请重试'); return; }
      var bb = liveBoard(b);
      var t = findCard(bb, cardId);
      if (!t || !t.images || !t.images[idx]){ toast('这张图已被删除'); close(); return; }
      t.images[idx] = out;
      t.updatedAt = Date.now();
      bb.updatedAt = Date.now();
      touchBoard(bb);
      close();
      renderDrawer(); renderMain();
      toast('素材已更新');
    });
    right.appendChild(cancel); right.appendChild(save);
    foot.appendChild(right);
    box.appendChild(foot);

    mask.appendChild(box);
    document.body.appendChild(mask);
    function close(){
      if (mask.parentNode) mask.parentNode.removeChild(mask);
      document.removeEventListener('keydown', onKey, true);
    }
    function onKey(e){ if (e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); close(); } }
    x.addEventListener('click', close);
    mask.addEventListener('click', function(e){ if (e.target === mask) close(); });
    document.addEventListener('keydown', onKey, true);
  }

  function clearDay(b, ds){
    var list = cardsOf(b, ds), notes = notesOn(b, ds);
    if (!list.length && !notes.length){ toast('这一天还没有内容'); return; }
    askConfirm('清空 ' + ds + ' 的全部内容？将删除 ' + list.length + ' 条排期、' + notes.length + ' 条备注（含图片），清空后不可恢复。', '清空这一天', function(){
      var bb = liveBoard(b), now = Date.now();
      (bb.cards || []).forEach(function(c){ if (c.date === ds && !c.deleted){ c.deleted = true; c.updatedAt = now; } });
      (bb.notes || []).forEach(function(n){ if (n.date === ds && !n.deleted){ n.deleted = true; n.updatedAt = now; } });
      if (bb.dateColors) bb.dateColors[ds] = { color: null, updatedAt: now };
      bb.updatedAt = now;
      touchBoard(bb);
      renderMain();
      if (drawerDate === ds) renderDrawer();

  function pasteFromClipboard(b, c){
    if (!navigator.clipboard || !navigator.clipboard.read){
      toast('请直接按 ⌘V / Ctrl+V 粘贴');
      return;
    }
    navigator.clipboard.read().then(function(items){
      var jobs = [];
      for (var i=0;i<items.length;i++){
        var types = items[i].types || [];
        for (var j=0;j<types.length;j++){
          if (/^image\//.test(types[j])) jobs.push(items[i].getType(types[j]));
        }
      }
      if (!jobs.length){ toast('剪贴板里没有图片'); return; }
      Promise.all(jobs).then(function(blobs){ attachImages(b, c, blobs); });
    }).catch(function(){
      toast('读取剪贴板被拦截，请直接按 ⌘V / Ctrl+V');
    });
  }

  document.addEventListener('paste', function(e){
    var fs = imageFilesFrom(e.clipboardData);
    if (!fs.length) return;                       // 纯文本粘贴照常放行
    if (view === 'gallery'){
      e.preventDefault();
      addToGallery(fs);
      return;
    }
    if (!$drawer.classList.contains('open')) return;
    var t = pasteTarget();
    if (!t) return;
    e.preventDefault();
    attachImages(t.board, t.card, fs);

  function compress(file, maxW, quality){
    maxW = maxW || 1000; quality = quality || 0.72;
    return new Promise(function(resolve){
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function(){
        var scale = Math.min(1, maxW / img.width);
        var cv = document.createElement('canvas');
        cv.width = Math.round(img.width * scale);
        cv.height = Math.round(img.height * scale);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url);
        resolve(cv.toDataURL('image/jpeg', quality));
      };
      img.onerror = function(){ URL.revokeObjectURL(url); resolve(''); };
      img.src = url;
    });
  }

  function pngClipboardItem(src){
    return new Promise(function(resolve, reject){
      var img = new Image();
      img.onload = function(){
        try{
          var cv = document.createElement('canvas');
          cv.width = img.width; cv.height = img.height;
          cv.getContext('2d').drawImage(img, 0, 0);
          cv.toBlob(function(b){
            if (b && window.ClipboardItem) resolve(new ClipboardItem({'image/png': b}));
            else reject();
          }, 'image/png');
        }catch(e){ reject(); }
      };
      img.onerror = reject;
      img.src = src;
    });
  }

  /* ---------- 数据统计（跨页面汇总：渠道 × 活动） ---------- */
  function normStats(){
    if (!Array.isArray(S.stats)) S.stats = [];
    return S.stats.filter(function(r){ return r && !r.deleted; });
  }
  function chOrder(ch){
    var l = channelNames();
    var i = l.indexOf(ch);
    return i < 0 ? 99 : i;
  }
  /* 汇总：卡片标记（channel/activity/imgRole）+ 手工活动行（S.stats）合并成统计行 */
  function statRows(){
    var rows = {};
    function getRow(ch){
      var key = ch || '未指定渠道';
      if (!rows[key]){
        rows[key] = { channel: key, start:'', end:'',
                      creative:0, extended:0, creativeImgs:[], manual:null,
                      designers:{}, contacts:{} };
      }
      return rows[key];
    }
    /* 数据全部调取【横向日历】的排期卡片：图片张数、设计人、对接人、日期 */
    liveBoards().forEach(function(b){
      (b.cards || []).forEach(function(c){
        if (c.deleted) return;
        var hasAct = !!(c.activity && c.activity.trim());
        if (!c.channel && !hasAct) return;          // 完全未标记的排期不进统计
        var r = getRow(c.channel || '');
        var imgs = (c.images || []).length;
        if (c.designer) r.designers[c.designer] = true;
        if (c.contact) r.contacts[c.contact] = true;
        if (c.imgRole === 'extended') r.extended += imgs;
        else {
          r.creative += imgs;
          (c.images || []).forEach(function(src, i){
            r.creativeImgs.push({ src: src, name: (r.channel + '-' + (c.title || '未命名') + '-' + (c.date || '') + '-' + (i+1) + '.jpg').replace(/[\\/:*?"<>|\s]+/g, '-') });
          });
        }
        if (c.date){
          if (!r.start || c.date < r.start) r.start = c.date;
          if (!r.end || c.date > r.end) r.end = c.date;
        }
      });
    });
    /* 手工设置的活动时间覆盖卡片日期范围 */
    normStats().forEach(function(m){
      if (!m.channel) return;
      var r = getRow(m.channel);
      if (m.start && (!r.start || m.start < r.start)) r.start = m.start;
      if (m.end && (!r.end || m.end > r.end)) r.end = m.end;
      if (!r.manual) r.manual = m;
    });
    var list = Object.keys(rows).map(function(k){ return rows[k]; });
    list.sort(function(x, y){
      var c = chOrder(x.channel) - chOrder(y.channel);
      if (c) return c;
      if (x.start !== y.start) return (x.start < y.start ? -1 : 1);
      return x.channel < y.channel ? -1 : 1;
    });
    return list;
  }
  /* 手工活动时间：通过时间选择弹框设置时落到 S.stats，随服务端同步 */
  function upsertManual(row){
    if (!row.manual){

        activity: '',
        start: '', end: '',
        createdAt: Date.now(), updatedAt: Date.now(), deleted: false
      };
      S.stats.push(row.manual);
    }
    return row.manual;
  }


  /* 统计视图状态：渠道多选（默认不选，选中才展示对应数据）、行多选、图表类型 */
  var statChOn = {};        // 渠道 -> true 表示已选中
  var statRowSel = null;    // null = 全部行；否则 {key: bool}
  var chartType = localStorage.getItem('pb.chart') || 'bar';

  function statChSelected(name){
    return statChOn[name] === true;      // 只有被点选的渠道才展示
  }
  function toggleChannel(name){
    if (statChOn[name]) delete statChOn[name];
    else statChOn[name] = true;
  }
  function selectedChannelCount(){
    return Object.keys(statChOn).filter(function(k){ return statChOn[k]; }).length;
  }
  function allChannelSelected(names){
    return names.length > 0 && names.every(statChSelected);
  }
  function visibleRows(){
    return statRows().filter(function(r){ return statChSelected(r.channel); });
  }
  function rowKey(r){ return r.channel; }
  function rowChecked(r){
    if (!statRowSel) return true;
    return !!statRowSel[rowKey(r)];
  }
  function selectedRows(){
    var rows = visibleRows();
    if (!statRowSel) return rows;
    return rows.filter(rowChecked);
  }

  /* ---------- 统计图表（纯 canvas，无外部依赖；悬停提示 + 点击筛选渠道） ---------- */
  var chartSeries = { creative: true, extended: true };   // 图表里显示哪些图片类型

  function renderStatsChart(rows){
    var box = el('div', 'chartbox');
    var head = el('div', 'chead');
    var hb = el('div');
    hb.appendChild(el('b', null, '渠道支持数据图表'));
    var hsub = el('span', null, '悬停查看数值 · 点击图形可选中 / 取消对应渠道');
    hsub.style.cssText = 'font-size:11px;color:var(--faint);margin-left:8px;';
    hb.appendChild(hsub);
    head.appendChild(hb);

    var right = el('div');
    right.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;align-items:center;';

    var typeSeg = el('div', 'seg');
    [['bar','柱状图'], ['pie','饼状图'], ['line','折线图'], ['scatter','点状图']].forEach(function(t){
      var bt = el('button', chartType === t[0] ? 'on' : '', t[1]);
      bt.addEventListener('click', function(){
        chartType = t[0];
        localStorage.setItem('pb.chart', chartType);
        renderStats();
      });
      typeSeg.appendChild(bt);
    });
    right.appendChild(typeSeg);

    var seriesSeg = el('div', 'seg');
    [['creative','创意图'], ['extended','延展图']].forEach(function(t){
      var on = !!chartSeries[t[0]];
      var bt = el('button', on ? 'on' : '', t[1]);
      bt.title = on ? '点击在图表中隐藏' + t[1] : '点击在图表中显示' + t[1];
      if (!on){ bt.style.color = 'var(--faint)'; bt.style.textDecoration = 'line-through'; }
      bt.addEventListener('click', function(){
        var next = { creative: chartSeries.creative, extended: chartSeries.extended };
        next[t[0]] = !next[t[0]];
        if (!next.creative && !next.extended) return;   // 至少保留一种
        chartSeries = next;
        renderStats();
      });
      seriesSeg.appendChild(bt);
    });
    right.appendChild(seriesSeg);
    head.appendChild(right);
    box.appendChild(head);

    var cvWrap = el('div');
    cvWrap.style.cssText = 'position:relative;';
    var cv = document.createElement('canvas');
    cvWrap.appendChild(cv);
    var tip = el('div', 'chart-tip');
    cvWrap.appendChild(tip);
    box.appendChild(cvWrap);
    $main.appendChild(box);

    /* 按渠道聚合 */
    var agg = {};
    var order = [];
    rows.forEach(function(r){
      var k = r.channel || '未指定渠道';
      if (!agg[k]){ agg[k] = { creative: 0, extended: 0 }; order.push(k); }
      agg[k].creative += r.creative;
      agg[k].extended += r.extended;
    });
    order.sort(function(a, b){ return chOrder(a) - chOrder(b); });
    var data = order.map(function(k){ return { label: k, creative: agg[k].creative, extended: agg[k].extended }; });

    var hoverIdx = -1;
    var geo = null;   // draw() 时记录几何信息，供命中检测

    function seriesVal(d){
      return (chartSeries.creative ? d.creative : 0) + (chartSeries.extended ? d.extended : 0);
    }

    function draw(){
      var dpr = 2;
      var W = 880, H = 320;
      cv.width = W * dpr; cv.height = H * dpr;
      var g = cv.getContext('2d');
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.clearRect(0, 0, W, H);
      g.font = '12px "PingFang SC", sans-serif';
      geo = null;

      if (!data.length || !data.some(function(d){ return seriesVal(d) > 0; })){
        g.fillStyle = '#9A8D83';
        g.textAlign = 'center';
        g.fillText('先在上方点选渠道，或所选渠道还没有图片数据', W/2, H/2);
        return;
      }

      if (chartType === 'pie'){ drawPie(g, W, H, data); return; }

      var pad = { l: 56, r: 16, t: 26, b: 56 };
      var maxV = 0;
      data.forEach(function(d){ maxV = Math.max(maxV, seriesVal(d), chartSeries.creative ? d.creative : 0, chartSeries.extended ? d.extended : 0); });
      maxV = Math.max(4, Math.ceil(maxV * 1.15));
      var iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
      // 网格与刻度
      g.strokeStyle = '#332D29'; g.fillStyle = '#8C8078';
      g.textAlign = 'right'; g.lineWidth = 1;
      var steps = 4;
      for (var s = 0; s <= steps; s++){
        var y = pad.t + ih * s / steps;
        g.beginPath(); g.moveTo(pad.l, y); g.lineTo(W - pad.r, y); g.stroke();
        g.fillText(String(Math.round(maxV * (1 - s / steps))), pad.l - 6, y + 4);
      }
      var n = data.length;
      var slot = iw / n;
      var x0 = function(i){ return pad.l + slot * i; };
      // X 轴标签
      g.textAlign = 'center'; g.fillStyle = '#8C8078';
      data.forEach(function(d, i){
        var lab = d.label.length > 9 ? d.label.slice(0, 8) + '…' : d.label;
        g.fillText(lab, x0(i) + slot / 2, H - pad.b + 16);
      });

      function xy(v, i){
        return { x: x0(i) + slot / 2, y: pad.t + ih * (1 - v / maxV) };
      }

      // 悬停高亮：整列淡色背景 + 顶部标记
      if (hoverIdx >= 0 && hoverIdx < n){
        g.fillStyle = 'rgba(242,234,225,.07)';
        g.fillRect(x0(hoverIdx) + 2, pad.t, slot - 4, ih);
      }

      var bw = Math.min(26, slot * 0.28);
      geo = { pad: pad, n: n, slot: slot, x0: x0, bw: bw, ih: ih, maxV: maxV, H: H, W: W };

      if (chartType === 'bar'){
        data.forEach(function(d, i){
          var cx = x0(i) + slot / 2;
          var on = (i === hoverIdx);
          if (chartSeries.creative && d.creative){
            var h1 = ih * d.creative / maxV;
            g.fillStyle = on ? '#C9303F' : '#A61B29';
            g.fillRect(cx - bw - 2, pad.t + ih - h1, bw, h1);
            if (on){ g.strokeStyle = '#F2EAE1'; g.lineWidth = 1.5; g.strokeRect(cx - bw - 2, pad.t + ih - h1, bw, h1); }
            g.fillStyle = '#E8B4AC'; g.textAlign = 'center'; g.fillText(String(d.creative), cx - bw/2 - 2, pad.t + ih - h1 - 4);
          }
          if (chartSeries.extended && d.extended){
            var h2 = ih * d.extended / maxV;
            g.fillStyle = on ? '#E3BC6B' : '#C9A050';
            g.fillRect(cx + 2, pad.t + ih - h2, bw, h2);
            if (on){ g.strokeStyle = '#F2EAE1'; g.lineWidth = 1.5; g.strokeRect(cx + 2, pad.t + ih - h2, bw, h2); }
            g.fillStyle = '#E3BC6B'; g.fillText(String(d.extended), cx + bw/2 + 2, pad.t + ih - h2 - 4);
          }
        });
      } else {
        // 折线 / 点状
        function path(key, color, colorOn, dash){
          if (!chartSeries[key]) return;
          var pts = data.map(function(d, i){ return xy(d[key === 'creative' ? 'creative' : 'extended'], i); });
          g.strokeStyle = color; g.fillStyle = color; g.lineWidth = 2;
          g.setLineDash(dash ? [5, 4] : []);
          g.beginPath();
          pts.forEach(function(p, i){ if (i === 0) g.moveTo(p.x, p.y); else g.lineTo(p.x, p.y); });
          g.stroke();
          g.setLineDash([]);
          pts.forEach(function(p, i){
            var on = (i === hoverIdx);
            g.beginPath();
            g.arc(p.x, p.y, on ? 7 : (chartType === 'scatter' ? 5 : 3.4), 0, Math.PI * 2);
            g.fillStyle = on ? '#F2EAE1' : color;
            g.globalAlpha = chartType === 'scatter' && !on ? 0.85 : 1;
            g.fill();
            g.globalAlpha = 1;
            if (on){ g.strokeStyle = color; g.lineWidth = 2; g.stroke(); }
          });
        }
        path('creative', '#A61B29', '#E8798A', false);
        path('extended', '#C9A050', '#E3BC6B', true);
        // 悬停竖向参考线
        if (hoverIdx >= 0 && hoverIdx < n){
          var px = x0(hoverIdx) + slot / 2;
          g.strokeStyle = 'rgba(242,234,225,.35)'; g.lineWidth = 1;
          g.setLineDash([3, 3]);
          g.beginPath(); g.moveTo(px, pad.t); g.lineTo(px, pad.t + ih); g.stroke();
          g.setLineDash([]);
        }
      }

      // 图例（只画当前显示的系列）
      var lx = pad.l + 4, ly = 12;
      g.textAlign = 'left';
      if (chartSeries.creative){
        g.fillStyle = '#A61B29'; g.fillRect(lx, ly, 12, 8);
        g.fillStyle = '#C4B8AC'; g.fillText('创意图', lx + 16, ly + 8);
      }
      if (chartSeries.extended){
        var ex = chartSeries.creative ? lx + 62 : lx;
        g.fillStyle = '#C9A050'; g.fillRect(ex, ly, 12, 8);
        g.fillStyle = '#C4B8AC'; g.fillText('延展图', ex + 16, ly + 8);
      }
    }

    function drawPie(g, W, H, data){
      var vals = data.map(function(d){ return { label: d.label, v: seriesVal(d) }; });
      var total = vals.reduce(function(s, d){ return s + d.v; }, 0);
      if (!total){ return; }
      var cx = W * 0.34, cy = H / 2, R = Math.min(H / 2 - 30, 110);
      var segs = [];
      var a0 = -Math.PI / 2;
      vals.forEach(function(d, i){
        if (!d.v){ segs.push(null); return; }
        var a1 = a0 + Math.PI * 2 * d.v / total;
        segs.push({ a0: a0, a1: a1 });
        g.beginPath();
        g.moveTo(cx, cy);
        g.arc(cx, cy, R, a0, a1);
        g.closePath();
        g.fillStyle = CHART_PALETTE[i % CHART_PALETTE.length];
        g.globalAlpha = (hoverIdx === i) ? 1 : 0.88;
        g.fill();
        g.globalAlpha = 1;
        g.strokeStyle = hoverIdx === i ? '#F2EAE1' : '#0E0C0B';
        g.lineWidth = hoverIdx === i ? 2.5 : 2;
        g.stroke();
        // 百分比标签
        var mid = (a0 + a1) / 2;
        var pr = R * 0.66;
        g.fillStyle = '#FFF9F0';
        g.textAlign = 'center';
        if (d.v / total > 0.06) g.fillText(Math.round(d.v / total * 100) + '%', cx + Math.cos(mid) * pr, cy + Math.sin(mid) * pr);
        a0 = a1;
      });
      geo = { pie: true, cx: cx, cy: cy, R: R, segs: segs };
      // 图例
      var lx = W * 0.62, ly = Math.max(20, H / 2 - vals.length * 11);
      vals.forEach(function(d, i){
        g.fillStyle = CHART_PALETTE[i % CHART_PALETTE.length];
        g.fillRect(lx, ly + i * 22, 12, 10);
        g.fillStyle = hoverIdx === i ? '#F2EAE1' : '#C4B8AC';
        g.textAlign = 'left';
        var lab = d.label.length > 12 ? d.label.slice(0, 11) + '…' : d.label;
        g.fillText(lab + '（' + d.v + '）', lx + 18, ly + i * 22 + 9);
      });
    }

    /* 命中检测：返回命中的渠道序号，未命中返回 -1 */
    function hitTest(mx, my){
      if (!geo || !data.length) return -1;
      if (geo.pie){
        var dx = mx - geo.cx, dy = my - geo.cy;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > geo.R + 6 || dist < 0) return -1;
        var ang = Math.atan2(dy, dx);
        for (var i = 0; i < geo.segs.length; i++){
          var s = geo.segs[i];
          if (!s) continue;
          // 归一化到 -PI/2 起始的连续角度
          var a = ang, a0 = s.a0, a1 = s.a1;
          while (a < a0) a += Math.PI * 2;
          if (a <= a1) return i;
        }
        return -1;
      }
      var pad = geo.pad;
      if (my < pad.t - 6 || my > geo.H - pad.b + 10) return -1;
      if (chartType === 'bar'){
        for (var j = 0; j < geo.n; j++){
          var cx = geo.x0(j) + geo.slot / 2;
          if (mx >= cx - geo.bw - 6 && mx <= cx + geo.bw + 6) return j;
        }
        return -1;
      }
      // 折线 / 点状：找最近的数据点
      var best = -1, bd = 24 * 24;
      for (var k = 0; k < geo.n; k++){
        var px = geo.x0(k) + geo.slot / 2;
        [['creative', chartSeries.creative], ['extended', chartSeries.extended]].forEach(function(sr){
          if (!sr[1]) return;
          var py = geo.pad.t + geo.ih * (1 - data[k][sr[0]] / geo.maxV);
          var dd = (mx - px) * (mx - px) + (my - py) * (my - py);
          if (dd < bd){ bd = dd; best = k; }
        });
      }
      return best;
    }

    function showTip(ev, idx){
      var d = data[idx];
      var rowsHtml = '';
      if (chartSeries.creative) rowsHtml += '<div class="row"><span class="dot" style="background:#A61B29"></span>创意图：' + d.creative + ' 张</div>';
      if (chartSeries.extended) rowsHtml += '<div class="row"><span class="dot" style="background:#C9A050"></span>延展图：' + d.extended + ' 张</div>';
      rowsHtml += '<div class="row"><span class="dot" style="background:#8A8A85"></span>合计：' + seriesVal(d) + ' 张</div>';
      rowsHtml += '<div class="dim">点击图形可选中 / 取消该渠道</div>';
      tip.innerHTML = '<b>' + d.label + '</b>' + rowsHtml;
      tip.style.display = 'block';
      var wr = cvWrap.getBoundingClientRect();
      var x = ev.clientX - wr.left + 16;
      var y = ev.clientY - wr.top + 14;
      if (x + tip.offsetWidth > wr.width - 8) x = ev.clientX - wr.left - tip.offsetWidth - 14;
      if (y + tip.offsetHeight > wr.height - 4) y = Math.max(4, wr.height - tip.offsetHeight - 6);
      tip.style.left = x + 'px';
      tip.style.top = y + 'px';
    }

    function canvasXY(ev){
      var r = cv.getBoundingClientRect();
      return {
        x: (ev.clientX - r.left) * (880 / r.width),
        y: (ev.clientY - r.top) * (320 / r.height)
      };
    }

    cv.addEventListener('mousemove', function(ev){
      var p = canvasXY(ev);
      var idx = hitTest(p.x, p.y);
      if (idx !== hoverIdx){ hoverIdx = idx; draw(); }
      if (idx >= 0){ cv.style.cursor = 'pointer'; showTip(ev, idx); }
      else { cv.style.cursor = 'default'; tip.style.display = 'none'; }
    });
    cv.addEventListener('mouseleave', function(){
      if (hoverIdx !== -1){ hoverIdx = -1; draw(); }
      tip.style.display = 'none';
    });
    cv.addEventListener('click', function(){
      if (hoverIdx < 0 || !data[hoverIdx]) return;
      var label = data[hoverIdx].label;
      toggleChannel(label);
      renderStats();
      toast(statChSelected(label) ? '已选中渠道「' + label + '」，表格与图表同步更新' : '已取消渠道「' + label + '」');
    });

    draw();
  }

  function statsData(){
    var rows = selectedRows();
    var tc = 0, te = 0;
    rows.forEach(function(r){ tc += r.creative; te += r.extended; });
    return { rows: rows, totC: tc, totE: te };
  }
  function statsFileName(ext){
    var d = new Date();
    return '设计统计-' + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + '.' + ext;
  }
  function saveBlob(blob, name){
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
  }
  function fmtRange(r){
    if (!r.start && !r.end) return '';
    return (r.start || '?') + ' 至 ' + (r.end || '?');
  }
  function joinMap(map){
    var a = Object.keys(map || {});
    return a.length ? a.join('、') : '';
  }
  function downloadStatsExcel(){
    var d = statsData();
    if (!d.rows.length){ toast('先在上方点选渠道，再导出统计'); return; }
    var esc = function(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };
    var html = '<html><head><meta charset="utf-8"></head><body><table border="1" cellspacing="0">' +
      '<tr style="background:#A61B29;color:#FFF6EC;font-weight:bold">' +
      '<th>渠道</th><th>活动时间</th><th>持续天数</th><th>创意图片(张)</th><th>延展图片(张)</th><th>设计人</th><th>对接人</th></tr>';
    d.rows.forEach(function(r){
      html += '<tr><td>' + esc(r.channel) + '</td><td>' + esc(fmtRange(r)) +
        '</td><td align="right">' + (daysBetween(r.start, r.end) || '') +
        '</td><td align="right">' + r.creative + '</td><td align="right">' + r.extended +
        '</td><td>' + esc(joinMap(r.designers)) + '</td><td>' + esc(joinMap(r.contacts)) + '</td></tr>';
    });
    html += '<tr style="font-weight:bold"><td>合计</td><td>' + d.rows.length + ' 个渠道</td><td></td><td align="right">' +
      d.totC + '</td><td align="right">' + d.totE + '</td><td></td><td></td></tr>';
    html += '</table></body></html>';
    saveBlob(new Blob(['\ufeff' + html], {type:'application/vnd.ms-excel'}), statsFileName('xls'));
    toast('已生成 Excel 文件（.xls，Excel / WPS 可直接打开）');
  }
  function downloadStatsCSV(){
    var d = statsData();
    if (!d.rows.length){ toast('先在上方点选渠道，再导出统计'); return; }
    var q = function(s){ return '"' + String(s).replace(/"/g, '""') + '"'; };
    var lines = ['渠道,活动时间,持续天数,创意图片(张),延展图片(张),设计人,对接人'];
    d.rows.forEach(function(r){
      lines.push([q(r.channel), q(fmtRange(r)), (daysBetween(r.start, r.end) || ''), r.creative, r.extended, q(joinMap(r.designers)), q(joinMap(r.contacts))].join(','));
    });
    lines.push([q('合计'), q(d.rows.length + ' 个渠道'), '', d.totC, d.totE, '', ''].join(','));
    saveBlob(new Blob(['\ufeff' + lines.join('\r\n')], {type:'text/csv;charset=utf-8'}), statsFileName('csv'));
    toast('已下载 CSV 表格');
  }
  function downloadAllCreative(){
    var d = statsData();
    var all = [];
    d.rows.forEach(function(r){ all = all.concat(r.creativeImgs); });
    if (!all.length){ toast('当前勾选范围内没有「创意图」：在排期编辑框里把图片类型标为「创意图」即可'); return; }
    all.forEach(function(it, i){
      setTimeout(function(){ downloadImage(it.src, it.name); }, i * 420);
    });
    toast('正在下载全部 ' + all.length + ' 张创意图');
  }






  if (location.search.indexOf("galshare") > -1){ setTimeout(function(){ openGalShareDialog(normGallery().slice(0,2)); }, 600); }
  if (location.search.indexOf("shot=issues") > -1){ setTimeout(function(){ openIssuesDialog("all"); }, 800); }

  /* ---------- 语音输入：任意输入框聚焦即出现麦克风，中文实时转文字 ---------- */
  (function(){
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    var mic = document.createElement('button');
    mic.id = 'micFab'; mic.type = 'button'; mic.textContent = '🎤';
    mic.title = '语音输入（点击开始，再点结束）';
    document.body.appendChild(mic);
    var tip = document.createElement('div');
    tip.id = 'micTip';
    document.body.appendChild(tip);

    var cur = null, rec = null, listening = false;

    function isField(el){
      if (!el || !el.tagName) return false;
      if (el.tagName === 'TEXTAREA') return true;
      if (el.tagName === 'INPUT'){
        var t = (el.type || 'text').toLowerCase();
        return t === 'text' || t === 'search';
      }
      return false;
    }
    function place(){
      if (!cur || !cur.isConnected){ mic.classList.remove('show'); tip.classList.remove('show'); return; }
      var r = cur.getBoundingClientRect();
      if (r.width < 40 || r.bottom < 0 || r.top > window.innerHeight){ mic.classList.remove('show'); return; }
      var x = Math.min(window.innerWidth - 34, r.right - 30);
      var y = Math.max(4, r.top + (r.height - 26) / 2);
      mic.style.left = x + 'px';
      mic.style.top = y + 'px';
      mic.classList.add('show');
      tip.style.left = Math.max(8, Math.min(x - 130, window.innerWidth - 296)) + 'px';
      tip.style.top = (y + 30) + 'px';
    }
    function showFor(el){ if (!isField(el)) return hide(); cur = el; place(); }
    function hide(){
      if (listening) return;
      cur = null;
      mic.classList.remove('show');
      tip.classList.remove('show');
    }
    function insert(text){
      if (!cur || !cur.isConnected) return;
      var el = cur;
      var s = el.selectionStart, e = el.selectionEnd;
      if (s == null){ s = e = (el.value || '').length; }
      var v = el.value || '';
      el.value = v.slice(0, s) + text + v.slice(e);
      var p = s + text.length;
      try { el.setSelectionRange(p, p); } catch(_){}
      el.dispatchEvent(new Event('input', { bubbles: true }));
      place();
    }
    function stopRec(){ if (rec){ try { rec.stop(); } catch(_){} } }
    function start(){
      if (!SR){ toast('当前浏览器不支持语音输入，请用 Chrome / Edge / Safari 打开'); return; }
      if (!cur) return;
      try { rec = new SR(); } catch(_){ toast('语音启动失败，请检查麦克风权限'); return; }
      rec.lang = 'zh-CN';
      rec.continuous = true;
      rec.interimResults = true;
      rec.maxAlternatives = 1;
      rec.onstart = function(){
        listening = true; mic.classList.add('on');
        tip.textContent = '正在听… 说话会自动转成文字';
        tip.classList.add('show');
      };
      rec.onresult = function(ev){
        var fin = '', mid = '';
        for (var i = ev.resultIndex; i < ev.results.length; i++){
          var r = ev.results[i];
          if (r.isFinal) fin += r[0].transcript; else mid += r[0].transcript;
        }
        if (fin) insert(fin);
        if (mid){ tip.textContent = '正在听… ' + mid; tip.classList.add('show'); }
        else if (fin){ tip.textContent = '已写入，可继续说，或再点麦克风结束'; }
      };
      rec.onerror = function(ev){
        var m = ev.error;
        if (m === 'not-allowed' || m === 'service-not-allowed') toast('麦克风权限被拒绝，请在浏览器里允许后重试');
        else if (m !== 'no-speech' && m !== 'aborted') toast('语音识别出错：' + m);
      };
      rec.onend = function(){
        listening = false; mic.classList.remove('on'); rec = null;
        tip.classList.remove('show');
        var a = document.activeElement;
        if (isField(a)) showFor(a); else hide();
      };
      try { rec.start(); } catch(_){ listening = false; }
    }
    mic.addEventListener('mousedown', function(e){ e.preventDefault(); });
    mic.addEventListener('click', function(e){
      e.preventDefault(); e.stopPropagation();
      if (listening) stopRec(); else start();
    });
    document.addEventListener('focusin', function(e){ showFor(e.target); }, true);
    document.addEventListener('focusout', function(){
      setTimeout(function(){
        var a = document.activeElement;
        if (isField(a)) showFor(a); else if (!listening) hide(); else place();
      }, 90);
    }, true);
    window.addEventListener('scroll', function(){ if (cur) place(); }, true);
    window.addEventListener('resize', function(){ if (cur) place(); });
  })();

  /* ---------- 启动 ---------- */
  (function(){
    var h = location.hash || '';
    var m = h.match(/view=(strip|timeline|stats|gallery)/);
    if (m){ view = m[1]; localStorage.setItem('pb.view', view); }
  })();

  fetch('/api/state', {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(next){
    S.version = next.version || 0;
    S.boards = next.boards || [];
    S.boards.forEach(ensure);
    S.stats = Array.isArray(next.stats) ? next.stats : [];
    S.systems = Array.isArray(next.systems) && next.systems.length ? next.systems
      : [{ id: 'sys_main', name: '诺康莱集团设计中台管理系统', createdAt: Date.now(), updatedAt: Date.now(), deleted: false }];
    S.channels = Array.isArray(next.channels) && next.channels.length ? next.channels
      : DEFAULT_CHANNELS.map(function(name, i){ return { id: 'ch_default_' + i, name: name, updatedAt: 0, deleted: false }; });
    S.designers = Array.isArray(next.designers) ? next.designers : [];
    S.contacts = Array.isArray(next.contacts) ? next.contacts : [];
    S.issues = Array.isArray(next.issues) ? next.issues : [];
    S.gallery = Array.isArray(next.gallery) ? next.gallery : [];
    if (!liveSystems().some(function(s){ return s.id === curSystemId; })){
      curSystemId = liveSystems()[0].id;
      localStorage.setItem('pb.system', curSystemId);
    }
    applySystemName();
    if (!sysBoards().length){
      S.boards.push(ensure({
        id: uid('board'), name: '排期总览', columns: 2, stripStart: '', systemId: curSystemId,
        createdAt: Date.now(), updatedAt: Date.now(), deleted:false,
        cards: [], notes: [], dateColors: {}
      }));
      scheduleSave();
    }
    var sb = sysBoards();
    if (!curBoardId || !sb.some(function(b){ return b.id === curBoardId; })){
      curBoardId = sb[0].id;
    }
    localStorage.setItem('pb.board', curBoardId);
    renderTabs(); renderMain();

    // 支持 #day=2026-11-11 直接打开某一天的编辑抽屉；#day=...&img=1 定位到某张素材
    var dm = (location.hash || '').match(/day=(\d{4}-\d{2}-\d{2})/);
    var im = (location.hash || '').match(/img=(\d+)/);
    if (dm) setTimeout(function(){
      openDay(dm[1]);
      if (im) setTimeout(function(){ focusImage(+im[1]); }, 320);
    }, 150);

    setInterval(pull, 3000);
  }).catch(function(){
    $main.innerHTML = '<div class="empty">加载失败，请刷新页面重试。</div>';
  });
})();
</script>
